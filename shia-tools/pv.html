<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mark·animate – image to video marker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 1100px;
            width: 100%;
            background: #2d2d3f;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: #f0e9ff;
        }
        h1 {
            font-weight: 400;
            font-size: 1.9rem;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 span {
            background: #5a4a9a;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .upload-area {
            background: #3b3b55;
            border-radius: 28px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #8f8bb3;
            transition: 0.2s;
            margin: 20px 0 18px 0;
        }
        .upload-area:hover {
            border-color: #c3a9ff;
            background: #43435f;
        }
        .upload-area label {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 400;
        }
        .upload-area input {
            display: none;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
            margin: 20px 0 14px 0;
            background: #252536;
            padding: 14px 22px;
            border-radius: 48px;
        }
        .tool-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        button, .button-like {
            background: #3d3d5c;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #6a5e9e;
            box-shadow: 0 4px 6px #00000030;
        }
        button:hover {
            background: #56567a;
            border-color: #b49eff;
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .mark-badge {
            background: #6c5fa0;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .canvas-wrapper {
            background: #1a1a28;
            border-radius: 36px;
            padding: 18px;
            display: flex;
            justify-content: center;
            border: 2px solid #514b77;
            margin: 16px 0 10px 0;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px black;
            background: #10101a;
            cursor: crosshair;
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background-image: 
                linear-gradient(45deg, #2f2f42 25%, transparent 25%),
                linear-gradient(-45deg, #2f2f42 25%, transparent 25%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px;
        }
        .elements-panel {
            background: #232334;
            border-radius: 28px;
            padding: 16px 22px;
            margin-top: 16px;
        }
        .marks-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            align-items: center;
            margin-bottom: 6px;
        }
        .mark-chip {
            background: #3c2f60;
            padding: 8px 22px 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            border: 1px solid #9580d4;
        }
        .indicator-dot {
            width: 14px;
            height: 14px;
            border-radius: 14px;
            background: #75c9b0;
            box-shadow: 0 0 8px #8df2d6;
        }
        .indicator-dot.pending {
            background: #e5c28e;
            box-shadow: 0 0 6px #ffb347;
        }
        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .download-btn {
            background: #6d49c0;
            border-color: #b491ff;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .note {
            color: #b3addb;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            ✦ mark.to.animate
            <span>jpg / png</span>
        </h1>
        
        <!-- upload -->
        <div class="upload-area" id="uploadArea">
            <label for="imageUpload">
                <span style="font-size:2.2rem;">🖼️⬆️</span>
                <span>click or drag to upload image</span>
                <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/jpg" />
            </label>
        </div>

        <!-- main toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button id="markBtn" title="click on canvas to add marks">✏️ mark element</button>
                <button id="resetMarksBtn">🗑️ reset all</button>
            </div>
            <div class="tool-group">
                <span class="mark-badge" id="markCounter">0 marked</span>
            </div>
            <div style="flex:1; text-align:right; font-size:0.9rem;">
                <span>✔️ mark → 3s left-to-right animation</span>
            </div>
        </div>

        <!-- canvas wrapper -->
        <div class="canvas-wrapper">
            <canvas id="mainCanvas" width="960" height="540"></canvas>
        </div>

        <!-- marks / elements list -->
        <div class="elements-panel" id="elementsPanel">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
                <span>📌 marked elements</span>
                <span style="background:#5e4a7c; padding:2px 14px; border-radius:30px; font-size:0.9rem;" id="chipCount">0</span>
            </div>
            <div class="marks-list" id="marksListContainer">
                <span style="opacity:0.7;">— no elements marked yet, click [mark element] then canvas —</span>
            </div>
        </div>

        <!-- footer + download -->
        <div class="footer-actions">
            <div class="note">
                ⏯️ each element appears with 3s left-to-right slide
            </div>
            <button id="downloadVideoBtn" class="download-btn" disabled>⬇️ download video (webm)</button>
        </div>
    </div>

    <!-- include recordrtc -->
    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    <script>
        (function() {
            // DOM elements
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const fileInput = document.getElementById('imageUpload');
            const markBtn = document.getElementById('markBtn');
            const resetMarksBtn = document.getElementById('resetMarksBtn');
            const markCounter = document.getElementById('markCounter');
            const chipCountSpan = document.getElementById('chipCount');
            const marksListDiv = document.getElementById('marksListContainer');
            const downloadBtn = document.getElementById('downloadVideoBtn');

            // state
            let baseImage = null;          // HTMLImageElement
            let marks = [];                 // { x, y } normalized 0..1 relative to canvas
            let markActive = false;          // are we in "mark adding" mode?
            let animationPreviewFrame = null; // optional

            // canvas intrinsic size (fixed 16:9)
            const CANVAS_W = 960;
            const CANVAS_H = 540;

            // helper: redraw background + marks
            function redrawCanvas() {
                ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
                
                // draw background image if exists
                if (baseImage) {
                    // draw fitting maintaining aspect (cover canvas)
                    const imgW = baseImage.naturalWidth;
                    const imgH = baseImage.naturalHeight;
                    const canvasRatio = CANVAS_W / CANVAS_H;
                    const imgRatio = imgW / imgH;

                    let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                    if (imgRatio > canvasRatio) {
                        // image wider: match width
                        drawWidth = CANVAS_W;
                        drawHeight = CANVAS_W / imgRatio;
                        offsetY = (CANVAS_H - drawHeight) / 2;
                    } else {
                        // image taller: match height
                        drawHeight = CANVAS_H;
                        drawWidth = CANVAS_H * imgRatio;
                        offsetX = (CANVAS_W - drawWidth) / 2;
                    }
                    ctx.drawImage(baseImage, offsetX, offsetY, drawWidth, drawHeight);
                } else {
                    // neutral background
                    ctx.fillStyle = '#1e1e2f';
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                    ctx.font = '24px system-ui';
                    ctx.fillStyle = '#6b6b9c';
                    ctx.textAlign = 'center';
                    ctx.fillText('upload image', CANVAS_W/2, CANVAS_H/2);
                }

                // draw all marks (cross)
                marks.forEach((mark, index) => {
                    const canvasX = mark.x * CANVAS_W;
                    const canvasY = mark.y * CANVAS_H;
                    
                    // circle
                    ctx.beginPath();
                    ctx.arc(canvasX, canvasY, 16, 0, 2*Math.PI);
                    ctx.fillStyle = '#fffa9e';
                    ctx.shadowColor = '#00000080';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#301060';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.font = 'bold 20px monospace';
                    ctx.fillStyle = '#2e1b4b';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(index+1, canvasX, canvasY-2);
                    
                    // small label
                    ctx.font = '12px system-ui';
                    ctx.fillStyle = '#eee';
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 6;
                    ctx.fillText('element', canvasX, canvasY+28);
                    ctx.shadowBlur = 0;
                });
            }

            // update mark chips
            function updateMarksUI() {
                markCounter.innerText = marks.length + (marks.length === 1 ? ' mark' : ' marks');
                chipCountSpan.innerText = marks.length;

                if (marks.length === 0) {
                    marksListDiv.innerHTML = '<span style="opacity:0.7;">— no elements marked yet —</span>';
                    downloadBtn.disabled = true;
                } else {
                    let html = '';
                    marks.forEach((m, idx) => {
                        html += `<div class="mark-chip">
                            <span class="indicator-dot pending"></span>
                            <span>element #${idx+1}  (${Math.round(m.x*100)}%, ${Math.round(m.y*100)}%)</span>
                        </div>`;
                    });
                    marksListDiv.innerHTML = html;
                    downloadBtn.disabled = false;
                }
                // also redraw
                redrawCanvas();
            }

            // reset everything except baseImage
            function resetMarks() {
                marks = [];
                updateMarksUI();
            }

            // handle image upload
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        baseImage = img;
                        resetMarks(); // also redraw
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // drag & drop basic
            const uploadArea = document.getElementById('uploadArea');
            uploadArea.addEventListener('dragover', (e) => e.preventDefault());
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    fileInput.files = e.dataTransfer.files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });

            // marking mode
            markBtn.addEventListener('click', () => {
                if (!baseImage) {
                    alert('upload an image first');
                    return;
                }
                markActive = true;
                markBtn.style.background = '#7d6ab0';
                markBtn.innerText = '✏️ click on canvas';
                setTimeout(() => {
                    markBtn.innerText = '✏️ mark element';
                    markBtn.style.background = '';
                }, 1200);
            });

            // canvas click: add mark if markActive
            canvas.addEventListener('click', (e) => {
                if (!markActive || !baseImage) return;

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const mouseCanvasX = (e.clientX - rect.left) * scaleX;
                const mouseCanvasY = (e.clientY - rect.top) * scaleY;

                // clamp to boundaries
                const normX = Math.min(1, Math.max(0, mouseCanvasX / CANVAS_W));
                const normY = Math.min(1, Math.max(0, mouseCanvasY / CANVAS_H));

                marks.push({ x: normX, y: normY });
                updateMarksUI();

                markActive = false;  // one click = one mark (deactivate after mark)
            });

            // reset marks
            resetMarksBtn.addEventListener('click', () => {
                resetMarks();
            });

            // ---------- video generation (RecordRTC) with 3s left-to-right per element ----------
            async function generateVideo() {
                if (!baseImage || marks.length === 0) {
                    alert('need image and at least one mark');
                    return;
                }

                // disable download during recording
                downloadBtn.disabled = true;
                const originalText = downloadBtn.innerText;
                downloadBtn.innerText = '⏳ rendering video...';

                // create a recording canvas (same size)
                const recordCanvas = document.createElement('canvas');
                recordCanvas.width = CANVAS_W;
                recordCanvas.height = CANVAS_H;
                const rCtx = recordCanvas.getContext('2d');

                // we need to simulate a "stopwatch" recording: each element appears one after another with slide.
                // total duration = marks.length * 3 seconds.
                const elementDuration = 3; // seconds
                const totalDuration = marks.length * elementDuration; 
                const fps = 30;
                const totalFrames = totalDuration * fps;

                // helper to draw a single frame with given progress (0..totalFrames)
                function drawFrame(frameIndex) {
                    rCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
                    
                    // 1. draw background image (same as canvas)
                    if (baseImage) {
                        const imgW = baseImage.naturalWidth;
                        const imgH = baseImage.naturalHeight;
                        const canvasRatio = CANVAS_W / CANVAS_H;
                        const imgRatio = imgW / imgH;

                        let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                        if (imgRatio > canvasRatio) {
                            drawWidth = CANVAS_W;
                            drawHeight = CANVAS_W / imgRatio;
                            offsetY = (CANVAS_H - drawHeight) / 2;
                        } else {
                            drawHeight = CANVAS_H;
                            drawWidth = CANVAS_H * imgRatio;
                            offsetX = (CANVAS_W - drawWidth) / 2;
                        }
                        rCtx.drawImage(baseImage, offsetX, offsetY, drawWidth, drawHeight);
                    } else {
                        rCtx.fillStyle = '#1e1e2f';
                        rCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                    }

                    // determine current element index based on frame
                    const timeSec = frameIndex / fps;
                    const elementIndex = Math.floor(timeSec / elementDuration); // 0-based
                    
                    // for each element: if element index <= currentElement, draw it (with possible slide)
                    for (let i = 0; i < marks.length; i++) {
                        if (i > elementIndex) continue; // not yet reached
                        
                        const mark = marks[i];
                        const targetX = mark.x * CANVAS_W;
                        const targetY = mark.y * CANVAS_H;

                        // element progress: if i == elementIndex, sliding phase, else fully visible
                        let progress = 1.0; // default full visible for past elements
                        if (i === elementIndex) {
                            // sliding: 0 → 1 over 3 sec
                            const elementStartTime = i * elementDuration;
                            const elapsedInElement = Math.min(elementDuration, Math.max(0, timeSec - elementStartTime));
                            progress = elapsedInElement / elementDuration; // 0..1
                        }

                        // left-to-right: start position (left edge, same y) interpolate to targetX
                        const startX = 0; // left edge (x=0)
                        const currentX = startX + (targetX - startX) * progress;
                        
                        // draw element highlight (big circle + number)
                        rCtx.save();
                        rCtx.shadowColor = '#00000080';
                        rCtx.shadowBlur = 16;
                        rCtx.beginPath();
                        rCtx.arc(currentX, targetY, 24, 0, 2*Math.PI);
                        rCtx.fillStyle = '#fffa9e';
                        rCtx.fill();
                        rCtx.shadowBlur = 0;
                        rCtx.strokeStyle = '#301060';
                        rCtx.lineWidth = 5;
                        rCtx.stroke();

                        rCtx.font = 'bold 28px monospace';
                        rCtx.fillStyle = '#2e1b4b';
                        rCtx.textAlign = 'center';
                        rCtx.textBaseline = 'middle';
                        rCtx.fillText(i+1, currentX, targetY-4);
                        rCtx.font = 'bold 16px system-ui';
                        rCtx.fillStyle = 'white';
                        rCtx.shadowColor = 'black';
                        rCtx.shadowBlur = 8;
                        rCtx.fillText('element', currentX, targetY+34);
                        rCtx.restore();
                    }
                }

                // use RecordRTC to capture canvas stream
                const stream = recordCanvas.captureStream(fps);
                const recorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm',
                    video: {
                        width: CANVAS_W,
                        height: CANVAS_H,
                        frameRate: fps
                    },
                    disableLogs: false
                });

                recorder.startRecording();

                // manual frame rendering loop
                for (let frame = 0; frame <= totalFrames; frame++) {
                    drawFrame(frame);
                    await new Promise(r => setTimeout(r, 1000 / fps)); // crude but simple
                }

                recorder.stopRecording(() => {
                    const blob = recorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `marked_animation_${marks.length}_elements.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // restore button
                    downloadBtn.disabled = false;
                    downloadBtn.innerText = originalText;

                    // stop all tracks
                    stream.getTracks().forEach(t => t.stop());
                });
            }

            downloadBtn.addEventListener('click', generateVideo);

            // initial update
            updateMarksUI();
        })();
    </script>
</body>
</html>
