<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Mapper - Animated Reveal</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0a0c14;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: #151821;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 50px -12px #000000;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            margin: 0;
        }
        .header h1 span {
            background: #2d3748;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 1rem;
            margin-left: 10px;
            color: #a0aec0;
        }
        .upload-area {
            background: #1e2432;
            border: 2px dashed #4a5568;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #718096;
            background: #252c3d;
        }
        .upload-area input {
            display: none;
        }
        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #cbd5e0;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .main-workspace {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        .canvas-section {
            background: #0f131a;
            border-radius: 20px;
            padding: 20px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            background: #0a0d14;
            border-radius: 12px;
            overflow: hidden;
            min-height: 400px;
        }
        #imageCanvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }
        .tools-panel {
            background: #1a1f2b;
            border-radius: 20px;
            padding: 20px;
            color: #e2e8f0;
        }
        .tool-section {
            margin-bottom: 25px;
        }
        .tool-section h3 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            margin-bottom: 15px;
        }
        .btn {
            background: #2d3748;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            border: 1px solid #4a5568;
        }
        .btn:hover {
            background: #3f4a61;
            border-color: #718096;
        }
        .btn.active {
            background: #4f46e5;
            border-color: #818cf8;
        }
        .btn.primary {
            background: #4f46e5;
            border-color: #818cf8;
            font-weight: 600;
        }
        .btn.primary:hover {
            background: #6366f1;
        }
        .elements-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .element-item {
            background: #252d3c;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4f46e5;
        }
        .element-preview {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: #2d3748;
        }
        .status-badge {
            background: #2d3748;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #a0aec0;
        }
        .video-preview {
            margin-top: 20px;
            padding: 15px;
            background: #0f131a;
            border-radius: 15px;
        }
        #previewVideo {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Image Region Mapper <span>animate regions → complete image</span></h1>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="upload-label">
                <span style="font-size: 3rem;">🖼️</span>
                <span>Click or drop image to start mapping</span>
                <span style="font-size: 0.9rem; color: #718096;">JPG, PNG, GIF supported</span>
            </label>
        </div>

        <div class="main-workspace">
            <!-- Canvas Section -->
            <div class="canvas-section">
                <div class="canvas-container">
                    <canvas id="imageCanvas" width="800" height="450"></canvas>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <div style="background: #1e2432; padding: 10px; border-radius: 10px; flex: 1;">
                        <span style="color: #a0aec0;">✏️ Click to add points | Close shape to complete region</span>
                    </div>
                </div>
            </div>

            <!-- Tools Panel -->
            <div class="tools-panel">
                <div class="tool-section">
                    <h3>Mapping Tools</h3>
                    <button class="btn" id="startMappingBtn">🔍 Start New Region</button>
                    <button class="btn" id="completeMappingBtn" disabled>✅ Complete Current Region</button>
                    <button class="btn" id="clearAllBtn">🗑️ Clear All Regions</button>
                </div>

                <div class="tool-section">
                    <h3>Mapped Regions (<span id="regionCount">0</span>)</h3>
                    <div class="elements-list" id="regionsList">
                        <div style="color: #718096; text-align: center; padding: 20px;">No regions mapped yet</div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Animation Preview</h3>
                    <button class="btn primary" id="generateVideoBtn" disabled>🎬 Generate Animation</button>
                </div>
            </div>
        </div>

        <!-- Video Preview Section -->
        <div class="video-preview" id="videoPreviewSection" style="display: none;">
            <h3 style="color: #e2e8f0; margin-top: 0;">Animation Preview</h3>
            <video id="previewVideo" controls></video>
            <button class="btn primary" id="downloadVideoBtn" style="margin-top: 15px; width: auto; display: inline-block;">⬇️ Download Video</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    <script>
        class ImageRegionMapper {
            constructor() {
                this.canvas = document.getElementById('imageCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.image = null;
                this.regions = []; // Store each region as array of points
                this.currentPoints = [];
                self.isMapping = false;
                
                // For image positioning
                this.imageOffset = { x: 0, y: 0 };
                this.imageSize = { width: 0, height: 0 };
                
                this.initEventListeners();
            }

            initEventListeners() {
                document.getElementById('fileInput').addEventListener('change', (e) => this.handleImageUpload(e));
                document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
                
                document.getElementById('startMappingBtn').addEventListener('click', () => this.startMapping());
                document.getElementById('completeMappingBtn').addEventListener('click', () => this.completeRegion());
                document.getElementById('clearAllBtn').addEventListener('click', () => this.clearAllRegions());
                
                this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
                
                // Drag and drop
                document.getElementById('uploadArea').addEventListener('dragover', (e) => e.preventDefault());
                document.getElementById('uploadArea').addEventListener('drop', (e) => {
                    e.preventDefault();
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.loadImage(file);
                    }
                });
            }

            handleImageUpload(e) {
                const file = e.target.files[0];
                if (file) this.loadImage(file);
            }

            loadImage(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.image = img;
                        this.fitImageToCanvas();
                        this.drawImage();
                        this.updateRegionsList();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            fitImageToCanvas() {
                const canvasRatio = this.canvas.width / this.canvas.height;
                const imageRatio = this.image.width / this.image.height;
                
                if (imageRatio > canvasRatio) {
                    // Image is wider
                    this.imageSize.width = this.canvas.width;
                    this.imageSize.height = this.canvas.width / imageRatio;
                    this.imageOffset.x = 0;
                    this.imageOffset.y = (this.canvas.height - this.imageSize.height) / 2;
                } else {
                    // Image is taller
                    this.imageSize.height = this.canvas.height;
                    this.imageSize.width = this.canvas.height * imageRatio;
                    this.imageOffset.x = (this.canvas.width - this.imageSize.width) / 2;
                    this.imageOffset.y = 0;
                }
            }

            canvasToImageCoords(canvasX, canvasY) {
                const x = (canvasX - this.imageOffset.x) / this.imageSize.width;
                const y = (canvasY - this.imageOffset.y) / this.imageSize.height;
                
                // Clamp to image boundaries
                return {
                    x: Math.max(0, Math.min(1, x)),
                    y: Math.max(0, Math.min(1, y))
                };
            }

            imageToCanvasCoords(imgX, imgY) {
                return {
                    x: this.imageOffset.x + (imgX * this.imageSize.width),
                    y: this.imageOffset.y + (imgY * this.imageSize.height)
                };
            }

            startMapping() {
                if (!this.image) {
                    alert('Please upload an image first');
                    return;
                }
                this.isMapping = true;
                this.currentPoints = [];
                document.getElementById('startMappingBtn').classList.add('active');
                document.getElementById('completeMappingBtn').disabled = false;
            }

            handleCanvasClick(e) {
                if (!this.isMapping || !this.image) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                
                const canvasX = (e.clientX - rect.left) * scaleX;
                const canvasY = (e.clientY - rect.top) * scaleY;
                
                // Convert to image coordinates
                const imgCoords = this.canvasToImageCoords(canvasX, canvasY);
                
                // Check if click is within image
                if (imgCoords.x >= 0 && imgCoords.x <= 1 && imgCoords.y >= 0 && imgCoords.y <= 1) {
                    this.currentPoints.push(imgCoords);
                    this.drawImage();
                    this.drawCurrentRegion();
                }
            }

            completeRegion() {
                if (this.currentPoints.length < 3) {
                    alert('Need at least 3 points to create a region');
                    return;
                }
                
                // Close the polygon
                this.currentPoints.push(this.currentPoints[0]);
                
                // Add to regions
                this.regions.push({
                    points: [...this.currentPoints],
                    id: Date.now() + Math.random()
                });
                
                // Reset mapping state
                this.isMapping = false;
                this.currentPoints = [];
                document.getElementById('startMappingBtn').classList.remove('active');
                document.getElementById('completeMappingBtn').disabled = true;
                
                this.drawImage();
                this.updateRegionsList();
                document.getElementById('generateVideoBtn').disabled = false;
            }

            clearAllRegions() {
                this.regions = [];
                this.currentPoints = [];
                this.isMapping = false;
                document.getElementById('startMappingBtn').classList.remove('active');
                document.getElementById('completeMappingBtn').disabled = true;
                this.drawImage();
                this.updateRegionsList();
                document.getElementById('generateVideoBtn').disabled = true;
            }

            drawImage() {
                if (!this.image) return;
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.drawImage(
                    this.image, 
                    this.imageOffset.x, 
                    this.imageOffset.y, 
                    this.imageSize.width, 
                    this.imageSize.height
                );
                
                // Draw existing regions
                this.regions.forEach((region, index) => {
                    this.drawRegion(region.points, `rgba(79, 70, 229, 0.3)`, index + 1);
                });
                
                // Draw current region if mapping
                if (this.currentPoints.length > 0) {
                    this.drawRegion(this.currentPoints, 'rgba(245, 158, 11, 0.3)');
                }
            }

            drawRegion(points, color, label = null) {
                if (points.length < 2) return;
                
                this.ctx.beginPath();
                const first = this.imageToCanvasCoords(points[0].x, points[0].y);
                this.ctx.moveTo(first.x, first.y);
                
                for (let i = 1; i < points.length; i++) {
                    const point = this.imageToCanvasCoords(points[i].x, points[i].y);
                    this.ctx.lineTo(point.x, point.y);
                }
                
                // Fill region
                this.ctx.fillStyle = color;
                this.ctx.fill();
                
                // Draw border
                this.ctx.strokeStyle = '#4f46e5';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                
                // Draw points
                points.forEach((point, i) => {
                    const p = this.imageToCanvasCoords(point.x, point.y);
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                    this.ctx.fillStyle = i === 0 ? '#10b981' : '#f59e0b';
                    this.ctx.fill();
                    this.ctx.strokeStyle = 'white';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                });
                
                // Draw label
                if (label) {
                    const center = this.imageToCanvasCoords(
                        points.reduce((sum, p) => sum + p.x, 0) / points.length,
                        points.reduce((sum, p) => sum + p.y, 0) / points.length
                    );
                    this.ctx.font = 'bold 16px system-ui';
                    this.ctx.fillStyle = 'white';
                    this.ctx.shadowColor = 'black';
                    this.ctx.shadowBlur = 4;
                    this.ctx.fillText(`#${label}`, center.x - 10, center.y - 10);
                    this.ctx.shadowBlur = 0;
                }
            }

            drawCurrentRegion() {
                // Draw connecting lines
                if (this.currentPoints.length > 1) {
                    this.ctx.beginPath();
                    const first = this.imageToCanvasCoords(this.currentPoints[0].x, this.currentPoints[0].y);
                    this.ctx.moveTo(first.x, first.y);
                    
                    for (let i = 1; i < this.currentPoints.length; i++) {
                        const point = this.imageToCanvasCoords(this.currentPoints[i].x, this.currentPoints[i].y);
                        this.ctx.lineTo(point.x, point.y);
                    }
                    
                    this.ctx.strokeStyle = '#f59e0b';
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }
            }

            updateRegionsList() {
                const container = document.getElementById('regionsList');
                const countSpan = document.getElementById('regionCount');
                
                countSpan.textContent = this.regions.length;
                
                if (this.regions.length === 0) {
                    container.innerHTML = '<div style="color: #718096; text-align: center; padding: 20px;">No regions mapped yet</div>';
                    return;
                }
                
                let html = '';
                this.regions.forEach((region, index) => {
                    html += `
                        <div class="element-item">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span>Region #${index + 1}</span>
                                <span class="status-badge">${region.points.length - 1} points</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            }
        }

        // Video Generator Class
        class VideoGenerator {
            constructor(mapper) {
                this.mapper = mapper;
                this.recorder = null;
            }

            async generateVideo() {
                if (this.mapper.regions.length === 0) return;

                const regions = this.mapper.regions;
                const canvas = document.createElement('canvas');
                canvas.width = this.mapper.canvas.width;
                canvas.height = this.mapper.canvas.height;
                const ctx = canvas.getContext('2d');

                // Animation settings
                const fps = 30;
                const regionDuration = 3; // 3 seconds per region
                const totalFrames = regions.length * regionDuration * fps;

                // Create stream and recorder
                const stream = canvas.captureStream(fps);
                this.recorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm',
                    video: { width: canvas.width, height: canvas.height }
                });

                this.recorder.startRecording();

                // Generate frames
                for (let frame = 0; frame <= totalFrames; frame++) {
                    const timeInSeconds = frame / fps;
                    const currentRegionIndex = Math.floor(timeInSeconds / regionDuration);
                    const regionProgress = (timeInSeconds % regionDuration) / regionDuration;

                    // Clear canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw regions up to current index
                    for (let i = 0; i <= currentRegionIndex && i < regions.length; i++) {
                        const region = regions[i];
                        const progress = i === currentRegionIndex ? regionProgress : 1;
                        
                        // Draw the region with left-to-right slide
                        this.drawAnimatedRegion(ctx, region, progress, i === currentRegionIndex);
                    }

                    await this.sleep(1000 / fps);
                }

                this.recorder.stopRecording(() => {
                    const blob = this.recorder.getBlob();
                    this.showVideoPreview(blob);
                });
            }

            drawAnimatedRegion(ctx, region, progress, isCurrent) {
                const points = region.points;
                
                // Create clipping region for the animated area
                ctx.save();
                
                // Calculate slide offset (left to right)
                const maxSlide = ctx.canvas.width;
                const slideOffset = (1 - progress) * maxSlide;
                
                // Apply slide transform
                ctx.translate(-slideOffset, 0);
                
                // Create region path
                ctx.beginPath();
                const first = this.mapper.imageToCanvasCoords(points[0].x, points[0].y);
                ctx.moveTo(first.x, first.y);
                
                for (let i = 1; i < points.length; i++) {
                    const point = this.mapper.imageToCanvasCoords(points[i].x, points[i].y);
                    ctx.lineTo(point.x, point.y);
                }
                
                // Clip to region
                ctx.clip();
                
                // Draw the image portion for this region
                if (this.mapper.image) {
                    ctx.drawImage(
                        this.mapper.image,
                        this.mapper.imageOffset.x,
                        this.mapper.imageOffset.y,
                        this.mapper.imageSize.width,
                        this.mapper.imageSize.height
                    );
                }
                
                ctx.restore();
                
                // Draw border for current region if animating
                if (isCurrent && progress < 1) {
                    ctx.save();
                    ctx.translate(-(1 - progress) * ctx.canvas.width, 0);
                    
                    ctx.beginPath();
                    ctx.moveTo(first.x, first.y);
                    for (let i = 1; i < points.length; i++) {
                        const point = this.mapper.imageToCanvasCoords(points[i].x, points[i].y);
                        ctx.lineTo(point.x, point.y);
                    }
                    
                    ctx.strokeStyle = '#4f46e5';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 5]);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            showVideoPreview(blob) {
                const video = document.getElementById('previewVideo');
                const url = URL.createObjectURL(blob);
                video.src = url;
                document.getElementById('videoPreviewSection').style.display = 'block';
                
                document.getElementById('downloadVideoBtn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'animated-regions.webm';
                    a.click();
                };
            }
        }

        // Initialize
        const mapper = new ImageRegionMapper();
        const videoGenerator = new VideoGenerator(mapper);

        document.getElementById('generateVideoBtn').addEventListener('click', () => {
            videoGenerator.generateVideo();
        });
    </script>
</body>
</html>
