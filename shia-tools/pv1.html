<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Marker - Animated Reveal</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b1120;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1200px;
            width: 100%;
            background: #1a1f2e;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px #000000;
        }
        h1 {
            color: #e2e8f0;
            font-weight: 400;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        h1 span {
            background: #2d3a5e;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 1rem;
            color: #94a3b8;
        }
        .upload-area {
            background: #1e2538;
            border: 2px dashed #3b4a6b;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-area:hover {
            border-color: #5f7ab0;
            background: #252e45;
        }
        .upload-area input {
            display: none;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }
        .canvas-container {
            background: #111827;
            border-radius: 24px;
            padding: 16px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #0b0f17;
            cursor: crosshair;
        }
        .panel {
            background: #1e2538;
            border-radius: 24px;
            padding: 20px;
        }
        .panel h3 {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 16px 0;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover {
            background: #6366f1;
        }
        .btn-secondary {
            background: #2d3a5e;
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: #3b4a75;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .elements-list {
            margin-top: 20px;
        }
        .element-chip {
            background: #252e45;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e2e8f0;
            border-left: 4px solid #4f46e5;
        }
        .element-number {
            background: #4f46e5;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .preview-section {
            margin-top: 24px;
            padding: 20px;
            background: #111827;
            border-radius: 24px;
        }
        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>
            ✦ mark + animate 
            <span>click elements → watch them appear</span>
        </h1>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <div style="font-size: 3rem; margin-bottom: 10px;">🖼️</div>
            <div style="color: #94a3b8; font-size: 1.2rem;">Click or drop image to start</div>
        </div>

        <div class="main-layout">
            <div class="canvas-container">
                <canvas id="mainCanvas" width="900" height="506"></canvas>
            </div>

            <div class="panel">
                <h3>MARKING TOOLS</h3>
                <button class="btn btn-primary" id="markBtn">
                    ✏️ Mark Element
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    🗑️ Reset All
                </button>

                <div style="margin: 20px 0; height: 1px; background: #2d3a5e;"></div>

                <h3>MARKED ELEMENTS (<span id="elementCount">0</span>)</h3>
                <div class="elements-list" id="elementsList">
                    <div style="color: #5f6c86; text-align: center; padding: 20px;">No elements marked yet</div>
                </div>

                <button class="btn btn-primary" id="generateBtn" style="margin-top: 20px;" disabled>
                    🎬 Generate Animation
                </button>
            </div>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <h3 style="color: #e2e8f0; margin: 0 0 15px 0;">Animation Preview</h3>
            <video id="previewVideo" controls></video>
            <button class="btn btn-primary" id="downloadBtn" style="margin-top: 15px; width: auto; padding: 12px 30px;">
                ⬇️ Download Video
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    <script>
        class ElementMarker {
            constructor() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.image = null;
                this.elements = []; // Store marked element positions
                this.isMarking = false;
                
                // Image positioning
                this.imgX = 0;
                this.imgY = 0;
                this.imgWidth = 0;
                this.imgHeight = 0;
                
                this.init();
            }

            init() {
                // File upload
                document.getElementById('fileInput').addEventListener('change', (e) => this.handleImage(e));
                document.getElementById('uploadArea').addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
                
                // Drag and drop
                document.getElementById('uploadArea').addEventListener('dragover', (e) => e.preventDefault());
                document.getElementById('uploadArea').addEventListener('drop', (e) => {
                    e.preventDefault();
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.loadImage(file);
                    }
                });

                // Mark button
                document.getElementById('markBtn').addEventListener('click', () => {
                    if (!this.image) {
                        alert('Please upload an image first');
                        return;
                    }
                    this.isMarking = true;
                    document.getElementById('markBtn').style.background = '#10b981';
                    document.getElementById('markBtn').innerHTML = '⚡ Click on element';
                    setTimeout(() => {
                        document.getElementById('markBtn').style.background = '';
                        document.getElementById('markBtn').innerHTML = '✏️ Mark Element';
                    }, 2000);
                });

                // Canvas click
                this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));

                // Reset button
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.elements = [];
                    this.isMarking = false;
                    this.drawImage();
                    this.updateElementsList();
                    document.getElementById('generateBtn').disabled = true;
                    document.getElementById('previewSection').style.display = 'none';
                });

                // Generate button
                document.getElementById('generateBtn').addEventListener('click', () => {
                    this.generateVideo();
                });
            }

            handleImage(e) {
                const file = e.target.files[0];
                if (file) this.loadImage(file);
            }

            loadImage(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.image = img;
                        this.fitImageToCanvas();
                        this.drawImage();
                        this.elements = [];
                        this.updateElementsList();
                        document.getElementById('generateBtn').disabled = true;
                        document.getElementById('previewSection').style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            fitImageToCanvas() {
                const canvasRatio = this.canvas.width / this.canvas.height;
                const imageRatio = this.image.width / this.image.height;

                if (imageRatio > canvasRatio) {
                    // Image wider than canvas
                    this.imgWidth = this.canvas.width;
                    this.imgHeight = this.canvas.width / imageRatio;
                    this.imgX = 0;
                    this.imgY = (this.canvas.height - this.imgHeight) / 2;
                } else {
                    // Image taller than canvas
                    this.imgHeight = this.canvas.height;
                    this.imgWidth = this.canvas.height * imageRatio;
                    this.imgX = (this.canvas.width - this.imgWidth) / 2;
                    this.imgY = 0;
                }
            }

            handleCanvasClick(e) {
                if (!this.isMarking || !this.image) return;

                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;

                const canvasX = (e.clientX - rect.left) * scaleX;
                const canvasY = (e.clientY - rect.top) * scaleY;

                // Check if click is within image
                if (canvasX >= this.imgX && canvasX <= this.imgX + this.imgWidth &&
                    canvasY >= this.imgY && canvasY <= this.imgY + this.imgHeight) {
                    
                    // Convert to normalized coordinates (0-1 relative to image)
                    const normX = (canvasX - this.imgX) / this.imgWidth;
                    const normY = (canvasY - this.imgY) / this.imgHeight;
                    
                    this.elements.push({
                        x: normX,
                        y: normY,
                        id: Date.now() + Math.random()
                    });

                    this.isMarking = false;
                    this.drawImage();
                    this.updateElementsList();
                    document.getElementById('generateBtn').disabled = false;
                }
            }

            drawImage() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (!this.image) {
                    // Blank canvas
                    this.ctx.fillStyle = '#0b0f17';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    return;
                }

                // Draw image
                this.ctx.drawImage(this.image, this.imgX, this.imgY, this.imgWidth, this.imgHeight);

                // Draw element markers
                this.elements.forEach((element, index) => {
                    const canvasX = this.imgX + (element.x * this.imgWidth);
                    const canvasY = this.imgY + (element.y * this.imgHeight);

                    // Draw circle
                    this.ctx.beginPath();
                    this.ctx.arc(canvasX, canvasY, 20, 0, 2 * Math.PI);
                    this.ctx.fillStyle = '#4f46e5';
                    this.ctx.globalAlpha = 0.3;
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                    this.ctx.strokeStyle = '#818cf8';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();

                    // Draw number
                    this.ctx.font = 'bold 16px system-ui';
                    this.ctx.fillStyle = 'white';
                    this.ctx.shadowColor = '#000';
                    this.ctx.shadowBlur = 4;
                    this.ctx.fillText(index + 1, canvasX - 8, canvasY - 12);
                    this.ctx.shadowBlur = 0;
                    
                    // Draw label
                    this.ctx.font = '12px system-ui';
                    this.ctx.fillStyle = '#e2e8f0';
                    this.ctx.fillText('element', canvasX - 25, canvasY + 30);
                });
            }

            updateElementsList() {
                const list = document.getElementById('elementsList');
                const count = document.getElementById('elementCount');
                
                count.textContent = this.elements.length;

                if (this.elements.length === 0) {
                    list.innerHTML = '<div style="color: #5f6c86; text-align: center; padding: 20px;">No elements marked yet</div>';
                    return;
                }

                let html = '';
                this.elements.forEach((el, i) => {
                    html += `
                        <div class="element-chip">
                            <div class="element-number">${i + 1}</div>
                            <div>Element ${i + 1}</div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            }

            async generateVideo() {
                if (this.elements.length === 0 || !this.image) return;

                document.getElementById('generateBtn').disabled = true;
                document.getElementById('generateBtn').innerHTML = '⏳ Rendering...';

                // Create video canvas
                const videoCanvas = document.createElement('canvas');
                videoCanvas.width = this.canvas.width;
                videoCanvas.height = this.canvas.height;
                const vCtx = videoCanvas.getContext('2d');

                // Animation settings
                const fps = 30;
                const elementDuration = 3; // 3 seconds per element
                const totalFrames = this.elements.length * elementDuration * fps;

                // Setup recorder
                const stream = videoCanvas.captureStream(fps);
                const recorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm',
                    video: {
                        width: videoCanvas.width,
                        height: videoCanvas.height
                    }
                });

                recorder.startRecording();

                // Generate frames
                for (let frame = 0; frame <= totalFrames; frame++) {
                    const timeInSeconds = frame / fps;
                    const currentElementIndex = Math.floor(timeInSeconds / elementDuration);
                    const elementProgress = (timeInSeconds % elementDuration) / elementDuration;

                    // Clear canvas (blank background)
                    vCtx.fillStyle = '#0b0f17';
                    vCtx.fillRect(0, 0, videoCanvas.width, videoCanvas.height);

                    // Draw elements that have been revealed
                    for (let i = 0; i <= currentElementIndex && i < this.elements.length; i++) {
                        const element = this.elements[i];
                        
                        // Calculate position with left-to-right animation
                        let drawX = this.imgX;
                        let drawWidth = this.imgWidth;
                        
                        if (i === currentElementIndex) {
                            // Currently animating element
                            const elementX = this.imgX + (element.x * this.imgWidth);
                            const slideProgress = elementProgress;
                            
                            // Create clipping region for this element
                            vCtx.save();
                            
                            // Start from left, move to correct position
                            const clipX = this.imgX + (element.x * this.imgWidth * slideProgress);
                            
                            // Create a region around the element
                            vCtx.beginPath();
                            vCtx.arc(
                                this.imgX + (element.x * this.imgWidth),
                                this.imgY + (element.y * this.imgHeight),
                                50, // Radius big enough to cover element area
                                0, 2 * Math.PI
                            );
                            vCtx.clip();
                            
                            // Draw the image portion
                            vCtx.drawImage(this.image, this.imgX, this.imgY, this.imgWidth, this.imgHeight);
                            
                            vCtx.restore();
                        } else {
                            // Previously revealed elements - draw full
                            vCtx.drawImage(this.image, this.imgX, this.imgY, this.imgWidth, this.imgHeight);
                        }
                    }

                    // Small delay to control frame rate
                    await new Promise(r => setTimeout(r, 1000 / fps));
                }

                recorder.stopRecording(() => {
                    const blob = recorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    
                    // Show preview
                    const video = document.getElementById('previewVideo');
                    video.src = url;
                    document.getElementById('previewSection').style.display = 'block';
                    
                    // Download button
                    document.getElementById('downloadBtn').onclick = () => {
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `animation-${this.elements.length}-elements.webm`;
                        a.click();
                    };

                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('generateBtn').innerHTML = '🎬 Generate Animation';
                    
                    // Stop all tracks
                    stream.getTracks().forEach(t => t.stop());
                });
            }
        }

        // Initialize
        new ElementMarker();
    </script>
</body>
</html>
