
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Template · Shia Tools by Rahil Abbas Rizvi</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B1E3F;
            --primary-light: #b33b5e;
            --primary-dark: #5a1329;
            --secondary: #D4AF37;
            --accent: #FFD700;
            --success: #059669;
            --danger: #dc2626;
            --info: #3b82f6;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Toast System */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
            min-width: 300px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast i { font-size: 1.2rem; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--info); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            backdrop-filter: blur(5px);
        }

        .loading-overlay.active { display: flex; }

        .loading-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: var(--shadow-xl);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Main App */
        .app-container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .back-btn {
            background: var(--secondary);
            color: var(--primary);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        /* Editor Panel */
        .editor-panel {
            background: var(--gray-50);
            border-right: 2px solid var(--gray-200);
            overflow-y: auto;
            padding: 20px;
        }

        .editor-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
        }

        .editor-section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Image Upload */
        .image-upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .image-upload-area:hover {
            border-color: var(--primary);
            background: var(--gray-50);
        }

        .image-upload-area i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .preview-image {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .preview-image img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .preview-image .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--danger);
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Dynamic Items */
        .dynamic-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dynamic-item {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--gray-200);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-btn {
            background: none;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            padding: 5px;
        }

        .item-btn:hover {
            color: var(--danger);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: var(--gray-100);
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            color: var(--gray-600);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: var(--gray-200);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Preview Panel */
        .preview-panel {
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .marketing-card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            box-shadow: var(--shadow-xl);
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Product Gallery */
        .product-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .gallery-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid var(--gray-200);
        }

        .main-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px solid var(--primary);
        }

        /* Badge */
        .badge {
            background: var(--secondary);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Price Tag */
        .price-tag {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }

        .price-tag small {
            font-size: 1rem;
            color: var(--gray-600);
        }

        /* Feature Grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature-box {
            text-align: center;
            padding: 20px;
            background: var(--gray-50);
            border-radius: 20px;
        }

        .feature-box i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        /* Testimonials */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .testimonial-card {
            background: var(--gray-50);
            padding: 20px;
            border-radius: 20px;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .stars {
            color: #fbbf24;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        /* CTA Button */
        .cta-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 0;
            width: 100%;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .editor-panel {
                max-height: 500px;
            }
        }

        /* Color Picker */
        .color-picker {
            width: 100%;
            height: 50px;
            padding: 5px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            cursor: pointer;
        }

        /* Icon Grid */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .icon-option {
            text-align: center;
            padding: 10px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-option:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Brand Watermark */
        .brand-watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(139,30,63,0.9);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Brand Watermark -->
    <div class="brand-watermark">
        <i class="fas fa-tools"></i> Shia Tools by Rahil Abbas Rizvi
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3 id="loadingMessage">Processing...</h3>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-box"></i>
                Product Template
                <span style="font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 50px;">with Image Upload</span>
            </h1>
            <div class="header-actions">
                <button class="header-btn back-btn" onclick="location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button class="header-btn" onclick="app.exportPDF()">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="header-btn" onclick="app.exportPNG()">
                    <i class="fas fa-file-image"></i> PNG
                </button>
                <button class="header-btn" onclick="app.exportHTML()">
                    <i class="fas fa-file-code"></i> HTML
                </button>
                <button class="header-btn" onclick="app.resetTemplate()">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Editor Panel -->
            <div class="editor-panel" id="editorPanel">
                <!-- Editor will be loaded by JavaScript -->
            </div>

            <!-- Preview Panel -->
            <div class="preview-panel">
                <div class="marketing-card" id="previewCard">
                    <!-- Preview will be loaded by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== PRODUCT TEMPLATE WITH IMAGE UPLOAD =====
        const app = {
            currentTemplate: 'product',
            
            // Product data with images
            productData: {
                badge: '🔥 BESTSELLER',
                name: 'Wireless Headphones Pro',
                tagline: 'Premium Sound, Zero Wires',
                description: 'Experience crystal clear audio with 40-hour battery life and active noise cancellation. Perfect for music lovers and professionals.',
                price: '99.99',
                currency: '$',
                discount: '20% OFF',
                images: [
                    'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500',
                    'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500',
                    'https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500'
                ],
                features: [
                    { icon: 'battery-full', text: '40h Battery' },
                    { icon: 'bluetooth', text: 'Bluetooth 5.0' },
                    { icon: 'volume-high', text: 'Noise Cancelling' },
                    { icon: 'microphone', text: 'Built-in Mic' }
                ],
                stats: [
                    { value: '50K+', label: 'Sold' },
                    { value: '4.8', label: 'Rating' },
                    { value: '2yr', label: 'Warranty' }
                ],
                reviews: [
                    { name: 'Ahmed Khan', rating: 5, text: 'Best headphones ever! The sound quality is amazing.' },
                    { name: 'Fatima Ali', rating: 5, text: 'Amazing quality and great battery life.' }
                ],
                cta: 'Shop Now →'
            },

            // Original data for reset
            originalData: {},

            // ===== TOAST SYSTEM =====
            toast: {
                show(message, type = 'info') {
                    const container = document.getElementById('toastContainer');
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    
                    let icon = 'info-circle';
                    if (type === 'success') icon = 'check-circle';
                    if (type === 'error') icon = 'exclamation-circle';
                    
                    toast.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
                    container.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.style.animation = 'slideIn 0.3s reverse';
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);
                },
                success(m) { this.show(m, 'success'); },
                error(m) { this.show(m, 'error'); },
                info(m) { this.show(m, 'info'); }
            },

            // ===== LOADING SYSTEM =====
            loading: {
                show(msg = 'Processing...') {
                    document.getElementById('loadingMessage').textContent = msg;
                    document.getElementById('loadingOverlay').classList.add('active');
                },
                hide() {
                    document.getElementById('loadingOverlay').classList.remove('active');
                }
            },

            // ===== INITIALIZE =====
            init() {
                // Store original data
                this.originalData = JSON.parse(JSON.stringify(this.productData));
                
                // Render editor and preview
                this.renderEditor();
                this.renderPreview();
                
                this.toast.success('🚀 Product template ready with image upload!');
            },

            // ===== RESET TEMPLATE =====
            resetTemplate() {
                if (confirm('Reset all changes to original?')) {
                    this.productData = JSON.parse(JSON.stringify(this.originalData));
                    this.renderEditor();
                    this.renderPreview();
                    this.toast.success('Template reset!');
                }
            },

            // ===== UPDATE DATA =====
            updateData(field, value) {
                this.productData[field] = value;
                this.renderPreview();
            },

            updateFeature(index, field, value) {
                this.productData.features[index][field] = value;
                this.renderPreview();
            },

            updateStat(index, field, value) {
                this.productData.stats[index][field] = value;
                this.renderPreview();
            },

            updateReview(index, field, value) {
                this.productData.reviews[index][field] = value;
                this.renderPreview();
            },

            // ===== IMAGE UPLOAD =====
            handleImageUpload(event) {
                const files = event.target.files;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        this.productData.images.push(e.target.result);
                        this.renderEditor();
                        this.renderPreview();
                        this.toast.success('Image uploaded!');
                    };
                    
                    reader.readAsDataURL(file);
                }
            },

            removeImage(index) {
                this.productData.images.splice(index, 1);
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Image removed');
            },

            // ===== ADD/REMOVE ITEMS =====
            addFeature() {
                this.productData.features.push({ icon: 'star', text: 'New Feature' });
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Feature added!');
            },

            removeFeature(index) {
                this.productData.features.splice(index, 1);
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Feature removed');
            },

            addStat() {
                this.productData.stats.push({ value: '100+', label: 'New Stat' });
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Stat added!');
            },

            removeStat(index) {
                this.productData.stats.splice(index, 1);
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Stat removed');
            },

            addReview() {
                this.productData.reviews.push({ 
                    name: 'New User', 
                    rating: 5, 
                    text: 'Great product!' 
                });
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Review added!');
            },

            removeReview(index) {
                this.productData.reviews.splice(index, 1);
                this.renderEditor();
                this.renderPreview();
                this.toast.success('Review removed');
            },

            // ===== RENDER EDITOR =====
            renderEditor() {
                const data = this.productData;
                const editor = document.getElementById('editorPanel');
                
                let html = `
                    <!-- Image Upload Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-images"></i> Product Images</h2>
                        <div class="image-upload-area" onclick="document.getElementById('imageInput').click()">
                            <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="app.handleImageUpload(event)">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>Click to Upload Images</h3>
                            <p style="color: var(--gray-500);">Supported: JPG, PNG, GIF (Max 5MB)</p>
                        </div>
                        
                        <div class="image-preview" id="imagePreview">
                            ${data.images.map((img, index) => `
                                <div class="preview-image">
                                    <img src="${img}" alt="Product ${index + 1}">
                                    <button class="remove-btn" onclick="app.removeImage(${index})">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Basic Info Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-info-circle"></i> Basic Info</h2>
                        
                        <div class="form-group">
                            <label>Badge</label>
                            <input type="text" class="form-control" value="${data.badge}" 
                                oninput="app.updateData('badge', this.value)">
                        </div>
                        
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" class="form-control" value="${data.name}" 
                                oninput="app.updateData('name', this.value)">
                        </div>
                        
                        <div class="form-group">
                            <label>Tagline</label>
                            <input type="text" class="form-control" value="${data.tagline}" 
                                oninput="app.updateData('tagline', this.value)">
                        </div>
                        
                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" rows="3" oninput="app.updateData('description', this.value)">${data.description}</textarea>
                        </div>
                    </div>

                    <!-- Pricing Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-tag"></i> Pricing</h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Price</label>
                                <input type="text" class="form-control" value="${data.price}" 
                                    oninput="app.updateData('price', this.value)">
                            </div>
                            <div class="form-group">
                                <label>Currency</label>
                                <input type="text" class="form-control" value="${data.currency}" 
                                    oninput="app.updateData('currency', this.value)">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Discount</label>
                            <input type="text" class="form-control" value="${data.discount}" 
                                oninput="app.updateData('discount', this.value)">
                        </div>
                    </div>

                    <!-- Features Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-list"></i> Features (${data.features.length})</h2>
                        <div id="featuresEditor"></div>
                        <button class="add-btn" onclick="app.addFeature()">
                            <i class="fas fa-plus"></i> Add Feature
                        </button>
                    </div>

                    <!-- Stats Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-chart-line"></i> Statistics</h2>
                        <div id="statsEditor"></div>
                        <button class="add-btn" onclick="app.addStat()">
                            <i class="fas fa-plus"></i> Add Stat
                        </button>
                    </div>

                    <!-- Reviews Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-star"></i> Reviews</h2>
                        <div id="reviewsEditor"></div>
                        <button class="add-btn" onclick="app.addReview()">
                            <i class="fas fa-plus"></i> Add Review
                        </button>
                    </div>

                    <!-- CTA Section -->
                    <div class="editor-section">
                        <h2><i class="fas fa-bullseye"></i> Call to Action</h2>
                        <div class="form-group">
                            <label>Button Text</label>
                            <input type="text" class="form-control" value="${data.cta}" 
                                oninput="app.updateData('cta', this.value)">
                        </div>
                    </div>
                `;

                editor.innerHTML = html;
                
                // Render sub-editors
                this.renderFeatures();
                this.renderStats();
                this.renderReviews();
            },

            renderFeatures() {
                const container = document.getElementById('featuresEditor');
                if (!container) return;
                
                const features = this.productData.features;
                let html = '<div class="dynamic-items">';
                
                features.forEach((f, i) => {
                    html += `
                        <div class="dynamic-item">
                            <div class="item-header">
                                <span><i class="fas fa-${f.icon}"></i> Feature ${i + 1}</span>
                                <button class="item-btn" onclick="app.removeFeature(${i})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <div class="form-row">
                                <input type="text" class="form-control" placeholder="Icon name" value="${f.icon}" 
                                    oninput="app.updateFeature(${i}, 'icon', this.value)">
                                <input type="text" class="form-control" placeholder="Text" value="${f.text}" 
                                    oninput="app.updateFeature(${i}, 'text', this.value)">
                            </div>
                            <div class="icon-grid">
                                <div class="icon-option" onclick="app.updateFeature(${i}, 'icon', 'star')"><i class="fas fa-star"></i></div>
                                <div class="icon-option" onclick="app.updateFeature(${i}, 'icon', 'heart')"><i class="fas fa-heart"></i></div>
                                <div class="icon-option" onclick="app.updateFeature(${i}, 'icon', 'bolt')"><i class="fas fa-bolt"></i></div>
                                <div class="icon-option" onclick="app.updateFeature(${i}, 'icon', 'check')"><i class="fas fa-check"></i></div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            },

            renderStats() {
                const container = document.getElementById('statsEditor');
                if (!container) return;
                
                const stats = this.productData.stats;
                let html = '<div class="dynamic-items">';
                
                stats.forEach((s, i) => {
                    html += `
                        <div class="dynamic-item">
                            <div class="item-header">
                                <span>Stat ${i + 1}</span>
                                <button class="item-btn" onclick="app.removeStat(${i})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <div class="form-row">
                                <input type="text" class="form-control" placeholder="Value" value="${s.value}" 
                                    oninput="app.updateStat(${i}, 'value', this.value)">
                                <input type="text" class="form-control" placeholder="Label" value="${s.label}" 
                                    oninput="app.updateStat(${i}, 'label', this.value)">
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            },

            renderReviews() {
                const container = document.getElementById('reviewsEditor');
                if (!container) return;
                
                const reviews = this.productData.reviews;
                let html = '<div class="dynamic-items">';
                
                reviews.forEach((r, i) => {
                    html += `
                        <div class="dynamic-item">
                            <div class="item-header">
                                <span>Review ${i + 1}</span>
                                <button class="item-btn" onclick="app.removeReview(${i})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <input type="text" class="form-control" placeholder="Name" value="${r.name}" 
                                oninput="app.updateReview(${i}, 'name', this.value)">
                            <select class="form-control" onchange="app.updateReview(${i}, 'rating', this.value)">
                                <option value="5" ${r.rating == 5 ? 'selected' : ''}>★★★★★ (5)</option>
                                <option value="4" ${r.rating == 4 ? 'selected' : ''}>★★★★☆ (4)</option>
                                <option value="3" ${r.rating == 3 ? 'selected' : ''}>★★★☆☆ (3)</option>
                                <option value="2" ${r.rating == 2 ? 'selected' : ''}>★★☆☆☆ (2)</option>
                                <option value="1" ${r.rating == 1 ? 'selected' : ''}>★☆☆☆☆ (1)</option>
                            </select>
                            <textarea class="form-control" placeholder="Review text" rows="2"
                                oninput="app.updateReview(${i}, 'text', this.value)">${r.text || ''}</textarea>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            },

            // ===== RENDER PREVIEW =====
            renderPreview() {
                const data = this.productData;
                const preview = document.getElementById('previewCard');
                
                const html = `
                    <div class="badge">${data.badge}</div>
                    
                    <!-- Product Gallery -->
                    <div class="product-gallery">
                        ${data.images.slice(0, 3).map(img => `
                            <img src="${img}" alt="Product" class="gallery-image">
                        `).join('')}
                    </div>
                    
                    <h1 style="font-size: 2.5rem; margin-bottom: 10px;">${data.name}</h1>
                    <p style="color: #666; font-size: 1.2rem; margin-bottom: 15px;">${data.tagline}</p>
                    <p style="margin-bottom: 20px;">${data.description}</p>
                    
                    <div class="price-tag">
                        ${data.currency}${data.price}
                        <small style="color: var(--success); margin-left: 10px;">${data.discount}</small>
                    </div>
                    
                    <div class="feature-grid">
                        ${data.features.map(f => `
                            <div class="feature-box">
                                <i class="fas fa-${f.icon}"></i>
                                <p style="font-weight: 500;">${f.text}</p>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="stats-grid">
                        ${data.stats.map(s => `
                            <div class="stat-box">
                                <div class="stat-value">${s.value}</div>
                                <div>${s.label}</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <h3 style="margin: 30px 0 20px;">Customer Reviews</h3>
                    <div class="testimonials-grid">
                        ${data.reviews.map(r => `
                            <div class="testimonial-card">
                                <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                                <p>"${r.text}"</p>
                                <div class="testimonial-author">
                                    <div class="author-avatar">${r.name.charAt(0)}</div>
                                    <strong>${r.name}</strong>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button class="cta-button" onclick="app.toast.success('Product added to cart!')">${data.cta}</button>
                    
                    <div style="margin-top: 20px; text-align: center; color: var(--gray-400); font-size: 0.8rem;">
                        <i class="fas fa-tools"></i> Shia Tools by Rahil Abbas Rizvi
                    </div>
                `;
                
                preview.innerHTML = html;
            },

            // ===== EXPORT FUNCTIONS =====
            async exportPDF() {
                this.loading.show('Generating PDF...');
                
                try {
                    const element = document.getElementById('previewCard');
                    
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        logging: false,
                        allowTaint: true,
                        useCORS: true
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'px',
                        format: 'a4'
                    });
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const ratio = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height);
                    const width = canvas.width * ratio;
                    const height = canvas.height * ratio;
                    
                    const x = (pdfWidth - width) / 2;
                    const y = (pdfHeight - height) / 2;
                    
                    pdf.addImage(imgData, 'PNG', x, y, width, height);
                    
                    const fileName = `${this.productData.name.replace(/\s+/g, '_')}_product.pdf`;
                    pdf.save(fileName);
                    
                    this.loading.hide();
                    this.toast.success('PDF downloaded successfully!');
                } catch (error) {
                    console.error(error);
                    this.loading.hide();
                    this.toast.error('PDF generation failed');
                }
            },

            async exportPNG() {
                this.loading.show('Generating PNG...');
                
                try {
                    const element = document.getElementById('previewCard');
                    
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        logging: false,
                        allowTaint: true,
                        useCORS: true
                    });
                    
                    const fileName = `${this.productData.name.replace(/\s+/g, '_')}_product.png`;
                    
                    canvas.toBlob((blob) => {
                        saveAs(blob, fileName);
                    });
                    
                    this.loading.hide();
                    this.toast.success('PNG downloaded successfully!');
                } catch (error) {
                    this.loading.hide();
                    this.toast.error('PNG generation failed');
                }
            },

            exportHTML() {
                this.loading.show('Generating HTML...');
                
                try {
                    const element = document.getElementById('previewCard');
                    const styles = document.querySelector('style').innerHTML;
                    
                    const fullHTML = `
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                            <title>${this.productData.name} - Product Marketing</title>
                            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                            <style>
                                * { margin: 0; padding: 0; box-sizing: border-box; }
                                body { 
                                    font-family: 'Inter', sans-serif; 
                                    padding: 40px; 
                                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                                    min-height: 100vh;
                                    display: flex;
                                    justify-content: center;
                                    align-items: center;
                                }
                                ${styles}
                                .preview-panel { padding: 0; background: none; }
                                .marketing-card { margin: 0 auto; }
                            </style>
                        </head>
                        <body>
                            <div class="preview-panel">
                                <div class="marketing-card">
                                    ${element.innerHTML}
                                </div>
                            </div>
                        </body>
                        </html>
                    `;
                    
                    const blob = new Blob([fullHTML], { type: 'text/html' });
                    const fileName = `${this.productData.name.replace(/\s+/g, '_')}_product.html`;
                    
                    saveAs(blob, fileName);
                    
                    this.loading.hide();
                    this.toast.success('HTML downloaded successfully!');
                } catch (error) {
                    this.loading.hide();
                    this.toast.error('HTML generation failed');
                }
            }
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
