<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CV maker · Shia community · WORKING EXPORTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- CRITICAL: Load libraries in correct order with fallbacks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f6;
            font-family: 'Inter', sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cv-app {
            max-width: 1500px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: #0e2a38;
            color: white;
            padding: 18px 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .app-header h1 {
            font-weight: 600;
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header h1 i {
            color: #ffb05c;
        }
        .header-badge {
            background: #1b4053;
            padding: 8px 22px;
            border-radius: 60px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 360px 1fr;
            transition: 0.2s;
        }

        .left-panel {
            background: #f7fafd;
            border-right: 1px solid #d4e0ec;
            padding: 22px 18px;
            overflow-y: auto;
            max-height: 80vh;
            transition: all 0.2s;
        }
        .left-panel.collapsed {
            display: none;
        }

        .panel-toggle {
            background: white;
            border: 2px solid #0e2a38;
            color: #0e2a38;
            width: 48px;
            height: 48px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.15s;
            margin: 12px 0 4px 18px;
        }
        .panel-toggle:hover {
            background: #0e2a38;
            color: white;
        }

        .right-panel {
            background: white;
            padding: 30px 30px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .cv-preview {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 40px 45px;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0,35,60,0.15);
            border: 1px solid #e6ecf2;
        }

        .cv-name {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            font-weight: 700;
            color: #06212e;
            line-height: 1.2;
        }
        .cv-title {
            font-size: clamp(1.2rem, 4vw, 1.9rem);
            color: #0e2a38;
            font-weight: 600;
            margin: 8px 0 16px 0;
        }
        .cv-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 35px;
            background: #edf4fa;
            padding: 18px 25px;
            border-radius: 60px;
            margin: 18px 0 25px 0;
        }
        .cv-contact span {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0e2a38;
            border-bottom: 4px solid #0e2a38;
            padding-bottom: 10px;
            margin: 30px 0 20px 0;
        }
        .skill-item {
            display: inline-block;
            background: #e9f0f8;
            padding: 8px 20px;
            margin: 0 12px 14px 0;
            border-radius: 60px;
            font-weight: 500;
            border-left: 5px solid #0e2a38;
        }
        .exp-item {
            margin-bottom: 28px;
        }
        .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }
        .exp-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: #00263b;
        }
        .exp-company {
            background: #dde9f5;
            padding: 5px 18px;
            border-radius: 60px;
            font-weight: 600;
        }
        .exp-date {
            color: #2c4c6b;
            font-weight: 500;
            margin: 6px 0 10px 0;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 22px 18px;
            margin-bottom: 24px;
            box-shadow: 0 5px 15px rgba(0, 20, 30, 0.04);
            border: 1px solid #dae3ee;
        }
        .card h3 {
            font-weight: 600;
            color: #102f40;
            margin-bottom: 18px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 6px solid #0e2a38;
            padding-left: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            color: #1f3f57;
            display: block;
            margin-bottom: 6px;
        }
        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #d4deec;
            border-radius: 30px;
            font-size: 1rem;
            background: #fafdff;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }
        input:focus, textarea:focus {
            border-color: #0e2a38;
            outline: none;
            background: white;
        }
        .add-btn {
            background: #0e2a38;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
        }
        .add-btn:hover {
            background: #1b4057;
        }
        .remove-btn {
            background: #c8354c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .remove-btn:hover {
            background: #a52a3d;
        }

        .color-options {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .color-dot {
            width: 45px;
            height: 45px;
            border-radius: 45px;
            border: 3px solid transparent;
            cursor: pointer;
        }
        .color-dot.active {
            border-color: black;
            transform: scale(1.12);
        }
        .template-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
        }
        .template-opt {
            background: #ecf3fa;
            padding: 12px 0;
            text-align: center;
            border-radius: 40px;
            font-weight: 600;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .template-opt.active {
            background: #0e2a38;
            color: white;
            border-color: #0e2a38;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }
        .switch input {
            opacity: 0; width:0; height:0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: #b0c5da;
            border-radius: 34px;
            transition: .2s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: .2s;
        }
        input:checked + .slider {
            background-color: #0e2a38;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .action-floating {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 999;
        }
        .action-btn {
            border: none;
            background: #0e2a38;
            color: white;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 30px -5px #0e2a3866;
            cursor: pointer;
            transition: 0.15s;
            border: 2px solid white;
        }
        .action-btn.print {
            background: #1a5f3e;
        }
        .action-btn.pdf {
            background: #b13e3e;
        }

        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }
        .modal-card {
            background: white;
            border-radius: 48px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
        }
        .export-opt {
            padding: 18px 25px;
            border: 2px solid #cbdae9;
            border-radius: 60px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .export-opt:hover {
            background: #f0f5fc;
            border-color: #0e2a38;
        }
        .export-opt i { font-size: 2.4rem; }
        .cancel-btn {
            background: #c0cfdf; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 60px; 
            font-weight: 700; 
            font-size: 1.2rem; 
            margin-top: 16px; 
            cursor: pointer;
            transition: 0.2s;
        }
        .cancel-btn:hover {
            background: #a5b9cf;
        }

        @media (max-width: 850px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .left-panel {
                max-height: 600px;
                border-right: none;
                border-bottom: 1px solid #d2e0ec;
            }
            .left-panel.collapsed {
                display: none;
            }
            .action-floating {
                bottom: 15px;
                right: 15px;
            }
            .action-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
        @media (max-width: 550px) {
            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media print {
            body * { visibility: hidden; }
            .cv-preview, .cv-preview * {
                visibility: visible;
            }
            .cv-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 1.8cm;
                box-shadow: none;
                border: none;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.active {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0e2a38;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="cv-app">
    <div class="app-header">
        <h1><i class="fa-solid fa-hands-helping"></i> CV maker · Shia community</h1>
        <div class="header-badge"><i class="fa-regular fa-circle-check"></i> Rahil Abbas Rizvi (demo)</div>
    </div>

    <div class="panel-toggle" id="toggleLeftBtn">
        <i class="fa-solid fa-angles-left" id="toggleIcon"></i>
    </div>

    <div class="dashboard">
        <!-- LEFT PANEL -->
        <div class="left-panel" id="leftPanel">
            <!-- Personal info -->
            <div class="card">
                <h3><i class="fa-regular fa-id-card"></i> Personal</h3>
                <div class="form-group">
                    <label>Full name</label>
                    <input type="text" id="name" value="Rahil Abbas Rizvi" oninput="updatePersonal('name', this.value)">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" value="Web Analyst & Digital Marketing Trainer" oninput="updatePersonal('title', this.value)">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" value="fake@mail.com" oninput="updatePersonal('email', this.value)">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" value="+91123xxxxxxx" oninput="updatePersonal('phone', this.value)">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" value="Mumbai, India" oninput="updatePersonal('location', this.value)">
                </div>
                <div class="form-group">
                    <label>LinkedIn</label>
                    <input type="text" id="linkedin" value="linkedin.com/in/rahil-abbas" oninput="updatePersonal('linkedin', this.value)">
                </div>
                <div class="form-group">
                    <label>Summary</label>
                    <textarea id="summary" rows="3" oninput="updatePersonal('summary', this.value)">15+ years digital marketing · Google certified · trainer · web analyst · SEO & Ads specialist</textarea>
                </div>
            </div>

            <!-- Skills -->
            <div class="card">
                <h3><i class="fa-regular fa-code"></i> Skills</h3>
                <div id="skillsList"></div>
                <div style="display: flex; gap: 5px; margin-top: 10px;">
                    <input type="text" id="newSkill" placeholder="e.g., Google Analytics" style="flex: 1;">
                    <button class="add-btn" onclick="addSkill()" style="width: auto; padding: 14px 20px;"><i class="fa-regular fa-plus"></i></button>
                </div>
            </div>

            <!-- Experience -->
            <div class="card">
                <h3><i class="fa-regular fa-briefcase"></i> Experience</h3>
                <div id="expList"></div>
                <button class="add-btn" onclick="addExperience()"><i class="fa-regular fa-plus"></i> Add experience</button>
            </div>

            <!-- Education -->
            <div class="card">
                <h3><i class="fa-regular fa-graduation-cap"></i> Education</h3>
                <div id="eduList"></div>
                <button class="add-btn" onclick="addEducation()">➕ Add education</button>
            </div>

            <!-- Projects -->
            <div class="card">
                <h3><i class="fa-regular fa-diagram-project"></i> Projects</h3>
                <div id="projList"></div>
                <button class="add-btn" onclick="addProject()">➕ Add project</button>
            </div>

            <!-- Certifications -->
            <div class="card">
                <h3><i class="fa-regular fa-certificate"></i> Certifications</h3>
                <div id="certList"></div>
                <button class="add-btn" onclick="addCertification()">➕ Add cert</button>
            </div>

            <!-- Languages -->
            <div class="card">
                <h3><i class="fa-regular fa-language"></i> Languages</h3>
                <div id="langList"></div>
                <button class="add-btn" onclick="addLanguage()">➕ Add language</button>
            </div>

            <!-- Custom section -->
            <div class="card">
                <h3><i class="fa-regular fa-plus"></i> Custom</h3>
                <div id="customList"></div>
                <div style="display:flex; gap:6px; margin-top:10px;">
                    <input type="text" id="customTitle" placeholder="Section title">
                    <button class="add-btn" onclick="addCustomSection()" style="width:auto;">add</button>
                </div>
            </div>

            <!-- Design -->
            <div class="card">
                <h3><i class="fa-regular fa-palette"></i> Design</h3>
                <div class="form-group">
                    <label>Template</label>
                    <div class="template-grid" id="templateGrid">
                        <div class="template-opt active" onclick="setTemplate('modern', this)">Modern</div>
                        <div class="template-opt" onclick="setTemplate('classic', this)">Classic</div>
                        <div class="template-opt" onclick="setTemplate('professional', this)">Pro</div>
                        <div class="template-opt" onclick="setTemplate('creative', this)">Creative</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-options">
                        <div class="color-dot active" style="background:#0e2a38;" onclick="setColor('#0e2a38', this)"></div>
                        <div class="color-dot" style="background:#2b5797;" onclick="setColor('#2b5797', this)"></div>
                        <div class="color-dot" style="background:#117a65;" onclick="setColor('#117a65', this)"></div>
                        <div class="color-dot" style="background:#a55233;" onclick="setColor('#a55233', this)"></div>
                    </div>
                </div>
            </div>

            <!-- Sections toggle -->
            <div class="card">
                <h3><i class="fa-regular fa-eye"></i> Show/Hide</h3>
                <div id="sectionToggles"></div>
            </div>
        </div>

        <!-- RIGHT PANEL preview -->
        <div class="right-panel">
            <div class="cv-preview template-modern" id="cvPreview"></div>
        </div>
    </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size: 1.2rem; color: #0e2a38;" id="loadingMessage">Processing...</div>
</div>

<!-- floating action buttons -->
<div class="action-floating">
    <button class="action-btn" onclick="openExportModal()"><i class="fa-regular fa-download"></i> Export</button>
    <button class="action-btn print" onclick="window.print()"><i class="fa-regular fa-print"></i> Print canvas</button>
    <button class="action-btn pdf" onclick="exportAsPDF()"><i class="fa-regular fa-file-pdf"></i> instant PDF</button>
</div>

<!-- export modal -->
<div class="modal" id="exportModal">
    <div class="modal-card">
        <h2 style="margin-bottom:20px;">Export as</h2>
        <div class="export-opt" id="pdfExportBtn">
            <i class="fa-regular fa-file-pdf" style="color:#b13e3e;"></i> 
            <span>PDF (high quality)</span>
        </div>
        <div class="export-opt" id="docxExportBtn">
            <i class="fa-regular fa-file-word" style="color:#0e2a38;"></i> 
            <span>DOCX (Word)</span>
        </div>
        <div class="export-opt" id="htmlExportBtn">
            <i class="fa-regular fa-file-code" style="color:#d97706;"></i> 
            <span>HTML (web page)</span>
        </div>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    // ===== GLOBAL VARIABLES - Make sure everything is in global scope =====
    let cvData = {
        personal: {
            name: "Rahil Abbas Rizvi",
            title: "Web Analyst & Digital Marketing Trainer",
            email: "fake@mail.com",
            phone: "+91123xxxxxxx",
            location: "Mumbai, India",
            linkedin: "linkedin.com/in/rahil-abbas",
            summary: "15+ years digital marketing · Google certified · trainer · web analyst · SEO & Ads specialist"
        },
        skills: ["Google Analytics", "Google Ads", "SEO", "Meta Ads", "Content Strategy", "Looker Studio", "GTM", "Email Marketing"],
        experience: [
            { title: "Lead Digital Analyst", company: "WebElevate", startDate: "2018", endDate: "present", description: "Campaign analysis, reporting, team training." },
            { title: "Senior Trainer", company: "Shia Youth Skills", startDate: "2015", endDate: "2018", description: "Trained 300+ students in Google Ads & Analytics." },
            { title: "Web Analyst", company: "NetPulse", startDate: "2010", endDate: "2015", description: "Google Ads certified specialist, SEO campaigns." }
        ],
        education: [
            { degree: "MBA Marketing", institution: "Mumbai University", year: "2012", details: "Digital marketing specialization" },
            { degree: "BCA", institution: "Shia PG College", year: "2009", details: "" }
        ],
        projects: [
            { name: "Shia job portal CV builder", description: "This interactive CV tool for community" },
            { name: "Analytics training hub", description: "Google Analytics 4 course for community" }
        ],
        certifications: ["Google Ads Search Cert", "GAIQ", "HubSpot Digital Marketing", "Meta Certified Media Buyer"],
        languages: [
            { language: "Urdu", level: "Native" },
            { language: "English", level: "Fluent" },
            { language: "Hindi", level: "Fluent" },
            { language: "Arabic", level: "Intermediate" }
        ],
        customSections: [
            { title: "Volunteer", content: "Mentor at Shia youth career council · career workshops" }
        ],
        design: { template: "modern", color: "#0e2a38" },
        sections: { summary: true, skills: true, experience: true, education: true, projects: true, certifications: true, languages: true, custom: true }
    };

    // ===== HELPER FUNCTIONS =====
    function showLoading(message) {
        document.getElementById('loadingMessage').textContent = message || 'Processing...';
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    function escapeHtml(text) {
        if (!text) return '';
        let div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== PERSONAL INFO =====
    function updatePersonal(field, value) {
        cvData.personal[field] = value;
        renderPreview();
    }

    // ===== SKILLS =====
    function addSkill() {
        let input = document.getElementById('newSkill');
        if (input.value.trim()) {
            cvData.skills.push(input.value.trim());
            input.value = '';
            renderSkills();
            renderPreview();
        }
    }
    
    function updateSkill(index, value) {
        cvData.skills[index] = value;
        renderPreview();
    }
    
    function removeSkill(index) {
        cvData.skills.splice(index, 1);
        renderSkills();
        renderPreview();
    }

    // ===== EXPERIENCE =====
    function addExperience() {
        cvData.experience.push({ title: "New Position", company: "Company", startDate: "2024", endDate: "Present", description: "Description" });
        renderExperience();
        renderPreview();
    }
    
    function updateExperience(index, field, value) {
        cvData.experience[index][field] = value;
        renderPreview();
    }
    
    function removeExperience(index) {
        cvData.experience.splice(index, 1);
        renderExperience();
        renderPreview();
    }

    // ===== EDUCATION =====
    function addEducation() {

    // ===== PDF EXPORT - COMPLETELY REWRITTEN TO WORK =====
    function exportAsPDF() {
        closeModal();
        showLoading('Generating PDF...');
        
        const element = document.getElementById('cvPreview');
        const originalHTML = element.innerHTML;
        
        // Use html2canvas + jsPDF directly (more reliable)
        html2canvas(element, {
            scale: 2,
            backgroundColor: '#ffffff',
            logging: false,
            allowTaint: false,
            useCORS: true
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'px',
                format: 'a4'
            });
            
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            
            // Calculate ratio to fit in PDF
            const ratio = Math.min(pdfWidth / canvasWidth, pdfHeight / canvasHeight);
            const width = canvasWidth * ratio;
            const height = canvasHeight * ratio;
            
            // Center on page
            const xOffset = (pdfWidth - width) / 2;
            const yOffset = (pdfHeight - height) / 2;
            
            pdf.addImage(imgData, 'PNG', xOffset, yOffset, width, height);
            pdf.save('Rahil_Abbas_Rizvi_CV.pdf');
            hideLoading();
            element.innerHTML = originalHTML;
        }).catch(error => {
            console.error('PDF error:', error);
            hideLoading();
            alert('PDF generation failed. Trying fallback method...');
            fallbackPrintPDF();
            element.innerHTML = originalHTML;
        });
    }

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <!DOCTYPE html>
            <html>
                <head>
                    <title>Rahil Abbas Rizvi - CV</title>
                    <meta charset="UTF-8">
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
                    <style>
                        ${styleText}
                        body {
                            background: white;
                            padding: 20px;
                            margin: 0;
                            font-family: 'Inter', sans-serif;
                        }
                        .cv-preview {
                            max-width: 210mm;
                            margin: 0 auto;
                            box-shadow: none;
                            border: none;
                            padding: 20mm;
                        }
                        @media print {
                            @page {
                                size: A4;
                                margin: 0;
                            }
                            body {
                                padding: 0;
                            }
                        }
                    </style>
                </head>
                <body>
                    ${preview.outerHTML}
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.print();
                                setTimeout(function() {

                                }, 1000);
                            }, 500);
                        }

            </html>
        `);
        printWindow.document.close();
    }

        renderLanguages();
        renderCustomSections();
        renderSectionToggles();
        renderPreview();

        // Left panel toggle
        document.getElementById('toggleLeftBtn').addEventListener('click', function() {
            document.getElementById('leftPanel').classList.toggle('collapsed');
            let icon = document.getElementById('toggleIcon');
            if (document.getElementById('leftPanel').classList.contains('collapsed')) {
                icon.classList.remove('fa-angles-left');
                icon.classList.add('fa-angles-right');
            } else {
                icon.classList.remove('fa-angles-right');
                icon.classList.add('fa-angles-left');
            }
        });

        // Enter key for skills
        document.getElementById('newSkill').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addSkill();
            }
        });

        // Export buttons - make sure they're properly attached
        document.getElementById('pdfExportBtn').addEventListener('click', exportAsPDF);
        document.getElementById('docxExportBtn').addEventListener('click', downloadDOCX);
        document.getElementById('htmlExportBtn').addEventListener('click', downloadHTML);
        
        // Close modal when clicking outside
        document.getElementById('exportModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Also attach direct PDF button
