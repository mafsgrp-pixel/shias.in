<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cvgen.html · Professional Visual CV Generator</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js for statistics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Export Libraries - ALL FORMATS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Docx export library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.8.2/docx.min.js"></script>

    <style>
        /* PROFESSIONAL STYLING */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0e2a38;
            --primary-light: #1e3f50;
            --primary-dark: #071a23;
            --accent: #ffb05c;
            --success: #059669;
            --danger: #dc2626;
            --info: #3b82f6;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --gray-900: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* MAIN CONTAINER */
        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: var(--accent);
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .download-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* MAIN LAYOUT */
        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            height: calc(100vh - 100px);
            overflow: hidden;
        }

        /* EDITOR PANEL */
        .editor-panel {
            background: var(--gray-50);
            border-right: 2px solid var(--gray-200);
            overflow-y: auto;
            padding: 20px;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* STATISTICS EDITOR */
        .stats-editor {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-editor-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 15px;
            border-radius: 15px;
        }

        .stat-editor-card input {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .stat-editor-card input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        /* SKILL ITEM */
        .skill-item {
            background: var(--gray-50);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .skill-slider {
            width: 100%;
            height: 6px;
            background: var(--gray-200);
            border-radius: 10px;
            -webkit-appearance: none;
        }

        .skill-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        /* PREVIEW PANEL */
        .preview-panel {
            padding: 30px;
            overflow-y: auto;
            background: var(--gray-100);
        }

        /* VISUAL CV */
        .visual-cv {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .stat-trend {
            margin-top: 8px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
        }

        /* CHARTS GRID */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-box {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            padding: 20px;
            height: 280px;
        }

        .chart-box h3 {
            font-size: 1rem;
            color: var(--gray-600);
            margin-bottom: 15px;
        }

        /* SKILL MATRIX */
        .skill-matrix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .skill-progress {
            background: var(--gray-50);
            padding: 15px;
            border-radius: 12px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: var(--gray-200);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* TIMELINE */
        .timeline {
            margin: 30px 0;
            padding: 20px;
            background: var(--gray-50);
            border-radius: 20px;
        }

        .timeline-track {
            display: flex;
            align-items: flex-end;
            height: 200px;
            gap: 20px;
            margin-top: 20px;
        }

        .timeline-bar {
            flex: 1;
            background: linear-gradient(0deg, var(--primary), var(--primary-light));
            border-radius: 15px 15px 0 0;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: white;
            padding-bottom: 8px;
            font-weight: 600;
            transition: height 0.3s;
        }

        .timeline-label {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        /* ACHIEVEMENT BADGES */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .badge.silver { background: linear-gradient(135deg, #e5e7eb, #9ca3af); }
        .badge.bronze { background: linear-gradient(135deg, #d97706, #b45309); }

        .badge i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .badge-value {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
        }

        /* BUTTONS */
        .add-btn {
            width: 100%;
            padding: 12px;
            background: var(--gray-100);
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            color: var(--gray-600);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .add-btn:hover {
            background: var(--gray-200);
            border-color: var(--primary);
            color: var(--primary);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
        }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.active { display: flex; }

        .loading-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .editor-panel { max-height: 500px; }
        }
    </style>
</head>
<body>
    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3 id="loadingMessage">Processing...</h3>
            <p id="loadingSub">Please wait</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        <!-- HEADER WITH ALL DOWNLOAD OPTIONS -->
        <div class="header">
            <h1>
                <i class="fas fa-chart-pie"></i>
                Visual CV Generator
            </h1>
            <div class="download-buttons">
                <button class="download-btn" onclick="cv.exportPDF()">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="download-btn" onclick="cv.exportDOCX()">
                    <i class="fas fa-file-word"></i> DOCX
                </button>
                <button class="download-btn" onclick="cv.exportPNG()">
                    <i class="fas fa-file-image"></i> PNG
                </button>
                <button class="download-btn" onclick="cv.exportHTML()">
                    <i class="fas fa-file-code"></i> HTML
                </button>
                <button class="download-btn" onclick="cv.exportJSON()">
                    <i class="fas fa-file-code"></i> JSON
                </button>
                <button class="download-btn" onclick="cv.exportCSV()">
                    <i class="fas fa-file-csv"></i> CSV
                </button>
                <button class="download-btn" onclick="cv.printCV()">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">
            <!-- EDITOR PANEL -->
            <div class="editor-panel">
                <!-- PERSONAL INFO -->
                <div class="section">
                    <h2><i class="fas fa-user"></i> Personal Information</h2>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="fullName" value="Rahil Abbas Rizvi" oninput="cv.updatePersonal('name', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Professional Title</label>
                        <input type="text" class="form-control" id="title" value="Senior Digital Marketing Expert" oninput="cv.updatePersonal('title', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" value="rahil.abbas@example.com" oninput="cv.updatePersonal('email', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" class="form-control" id="phone" value="+91 98765 43210" oninput="cv.updatePersonal('phone', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" class="form-control" id="location" value="Mumbai, India" oninput="cv.updatePersonal('location', this.value)">
                    </div>
                </div>

                <!-- VISUAL STATISTICS -->
                <div class="section">
                    <h2><i class="fas fa-chart-line"></i> Key Statistics</h2>
                    <div id="statsEditor" class="stats-editor"></div>
                    <button class="add-btn" onclick="cv.addStat()">
                        <i class="fas fa-plus"></i> Add Statistic
                    </button>
                </div>

                <!-- SKILLS WITH PROFICIENCY -->
                <div class="section">
                    <h2><i class="fas fa-code"></i> Skills Matrix</h2>
                    <div id="skillsEditor"></div>
                    <button class="add-btn" onclick="cv.addSkill()">
                        <i class="fas fa-plus"></i> Add Skill
                    </button>
                </div>

                <!-- EXPERIENCE TIMELINE -->
                <div class="section">
                    <h2><i class="fas fa-timeline"></i> Career Timeline</h2>
                    <div id="timelineEditor"></div>
                    <button class="add-btn" onclick="cv.addTimelineItem()">
                        <i class="fas fa-plus"></i> Add Milestone
                    </button>
                </div>

                <!-- ACHIEVEMENT BADGES -->
                <div class="section">
                    <h2><i class="fas fa-medal"></i> Achievement Badges</h2>
                    <div id="badgesEditor"></div>
                    <button class="add-btn" onclick="cv.addBadge()">
                        <i class="fas fa-plus"></i> Add Badge
                    </button>
                </div>

                <!-- PROJECT IMPACT -->
                <div class="section">
                    <h2><i class="fas fa-rocket"></i> Project Impact</h2>
                    <div id="projectsEditor"></div>
                    <button class="add-btn" onclick="cv.addProject()">
                        <i class="fas fa-plus"></i> Add Project
                    </button>
                </div>
            </div>

            <!-- PREVIEW PANEL -->
            <div class="preview-panel">
                <div class="visual-cv" id="cvPreview">
                    <!-- Dynamic preview will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // COMPLETE VISUAL CV GENERATOR
        // WITH ALL DOWNLOAD FORMATS
        // ============================================

        const cv = {
            // Data structure
            data: {
                personal: {
                    name: 'Rahil Abbas Rizvi',
                    title: 'Senior Digital Marketing Expert',
                    email: 'rahil.abbas@example.com',
                    phone: '+91 98765 43210',
                    location: 'Mumbai, India'
                },
                stats: [
                    { icon: 'chart-line', value: '245%', label: 'Revenue Growth', trend: '+32%' },
                    { icon: 'rocket', value: '47', label: 'Projects Completed', trend: '+12' },
                    { icon: 'users', value: '12', label: 'Team Size', trend: '+5' },
                    { icon: 'star', value: '4.8/5', label: 'Client Rating', trend: '98%' },
                    { icon: 'trophy', value: '$2.4M', label: 'Revenue Generated', trend: '+45%' },
                    { icon: 'clock', value: '8+', label: 'Years Experience', trend: '' }
                ],
                skills: [
                    { name: 'Digital Strategy', level: 95 },
                    { name: 'Google Analytics', level: 92 },
                    { name: 'SEO/SEM', level: 90 },
                    { name: 'Team Leadership', level: 88 },
                    { name: 'Content Marketing', level: 85 },
                    { name: 'Social Media', level: 82 }
                ],
                timeline: [
                    { year: '2020', value: 40, label: 'Specialist' },
                    { year: '2021', value: 60, label: 'Senior' },
                    { year: '2022', value: 75, label: 'Lead' },
                    { year: '2023', value: 90, label: 'Manager' },
                    { year: '2024', value: 95, label: 'Director' }
                ],
                badges: [
                    { type: 'gold', icon: 'trophy', value: '312%', label: 'Highest ROI' },
                    { type: 'silver', icon: 'medal', value: '50+', label: 'Projects' },
                    { type: 'bronze', icon: 'award', value: '4.9', label: 'Rating' },
                    { type: 'gold', icon: 'crown', value: 'Top 1%', label: 'Performer' }
                ],
                projects: [
                    { name: 'E-commerce Platform', roi: '+245%', team: '8', duration: '6mo' },
                    { name: 'Analytics Migration', roi: '+180%', team: '4', duration: '3mo' },
                    { name: 'SEO Campaign', roi: '+312%', team: '3', duration: '12mo' },
                    { name: 'Team Training', roi: '+95%', team: '12', duration: '2mo' }
                ],
                chartColors: ['#0e2a38', '#1e3f50', '#2b5797', '#10b981', '#f59e0b']
            },

            // Loading control
            loading: {
                show(msg = 'Processing...', sub = 'Please wait') {
                    document.getElementById('loadingMessage').textContent = msg;
                    document.getElementById('loadingSub').textContent = sub;
                    document.getElementById('loadingOverlay').classList.add('active');
                },
                hide() {
                    document.getElementById('loadingOverlay').classList.remove('active');
                }
            },

            // Toast notifications
            toast(msg, type = 'info') {
                alert(msg); // Simple alert for now
            },

            // Initialize
            init() {
                this.renderAll();
                this.initCharts();
                // Auto-save
                setInterval(() => this.saveToStorage(), 30000);
            },

            // Save to localStorage
            saveToStorage() {
                localStorage.setItem('cvData', JSON.stringify(this.data));
            },

            // Load from localStorage
            loadFromStorage() {
                const saved = localStorage.getItem('cvData');
                if (saved) {
                    this.data = JSON.parse(saved);
                    this.renderAll();
                    this.initCharts();
                }
            },

            // Update personal info
            updatePersonal(field, value) {
                this.data.personal[field] = value;
                this.renderPreview();
            },

            // Statistics management
            addStat() {
                this.data.stats.push({
                    icon: 'chart-line',
                    value: '0',
                    label: 'New Stat',
                    trend: '0%'
                });
                this.renderStats();
                this.renderPreview();
            },

            removeStat(index) {
                this.data.stats.splice(index, 1);
                this.renderStats();
                this.renderPreview();
            },

            updateStat(index, field, value) {
                this.data.stats[index][field] = value;
                this.renderPreview();
            },

            // Skills management
            addSkill() {
                this.data.skills.push({
                    name: 'New Skill',
                    level: 50
                });
                this.renderSkills();
                this.renderPreview();
            },

            removeSkill(index) {
                this.data.skills.splice(index, 1);
                this.renderSkills();
                this.renderPreview();
            },

            updateSkill(index, field, value) {
                this.data.skills[index][field] = field === 'level' ? parseInt(value) : value;
                this.renderPreview();
                this.updateCharts();
            },

            // Timeline management
            addTimelineItem() {
                this.data.timeline.push({
                    year: '2024',
                    value: 50,
                    label: 'New'
                });
                this.renderTimeline();
                this.renderPreview();
            },

            removeTimeline(index) {
                this.data.timeline.splice(index, 1);
                this.renderTimeline();
                this.renderPreview();
            },

            updateTimeline(index, field, value) {
                this.data.timeline[index][field] = field === 'value' ? parseInt(value) : value;
                this.renderPreview();
            },

            // Badges management
            addBadge() {
                this.data.badges.push({
                    type: 'gold',
                    icon: 'award',
                    value: '100%',
                    label: 'New Badge'
                });
                this.renderBadges();
                this.renderPreview();
            },

            removeBadge(index) {
                this.data.badges.splice(index, 1);
                this.renderBadges();
                this.renderPreview();
            },

            updateBadge(index, field, value) {
                this.data.badges[index][field] = value;
                this.renderPreview();
            },

            // Projects management
            addProject() {
                this.data.projects.push({
                    name: 'New Project',
                    roi: '0%',
                    team: '0',
                    duration: '0'
                });
                this.renderProjects();
                this.renderPreview();
            },

            removeProject(index) {
                this.data.projects.splice(index, 1);
                this.renderProjects();
                this.renderPreview();
            },

            updateProject(index, field, value) {
                this.data.projects[index][field] = value;
                this.renderPreview();
            },

            // Render all editors
            renderAll() {
                this.renderStats();
                this.renderSkills();
                this.renderTimeline();
                this.renderBadges();
                this.renderProjects();
                this.renderPreview();
            },

            renderStats() {
                const container = document.getElementById('statsEditor');
                let html = '';
                
                this.data.stats.forEach((stat, index) => {
                    html += `
                        <div class="stat-editor-card">
                            <div style="display: flex; justify-content: space-between;">

                    this.data.skills.forEach(skill => {

            // Initialize all charts

                        type: 'bar',
                        data: {

                                borderRadius: 8

                            datasets: [{

                                data: this.data.timeline.map(t => t.value),
                                borderColor: this.data.chartColors[0],
                                backgroundColor: 'rgba(14,42,56,0.1)',

                                fill: true
                            }]
                        },

                            maintainAspectRatio: false,

                }

            updateCharts() {
                // Destroy existing charts and recreate
                this.initCharts();
            },

            // ============================================
            // EXPORT FUNCTIONS - ALL FORMATS
            // ============================================

            // 1. PDF EXPORT
            async exportPDF() {
                this.loading.show('Generating PDF...', 'Creating high-quality PDF');
                
                try {
                    const element = document.getElementById('cvPreview');
                    
                    // Create canvas with high quality
                    const canvas = await html2canvas(element, {
                        scale: 3,
                        backgroundColor: '#ffffff',
                        logging: false,
                        allowTaint: true,
                        useCORS: true
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    
                    // Calculate dimensions
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'px',
                        format: 'a4'
                    });
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const ratio = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height);
                    const width = canvas.width * ratio;
                    const height = canvas.height * ratio;
                    
                    const x = (pdfWidth - width) / 2;
                    const y = (pdfHeight - height) / 2;
                    
                    pdf.addImage(imgData, 'PNG', x, y, width, height);
                    
                    // Save with name
                    const fileName = `${this.data.personal.name.replace(/\s+/g, '_')}_CV.pdf`;
                    pdf.save(fileName);
                    
                    this.loading.hide();
                    alert('PDF downloaded successfully!');
                } catch (error) {
                    console.error(error);
                    this.loading.hide();
                    alert('PDF export failed, trying fallback...');
                    this.fallbackPrint();
                }
            },

            // 2. DOCX EXPORT
            async exportDOCX() {

                    const element = document.getElementById('cvPreview');
                    const html = element.outerHTML;
                    
                    // Create styled document
                    const styles = document.querySelector('style').innerHTML;
                    
                    const fullHTML = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <meta charset="UTF-8">
                            <title>${this.data.personal.name} - CV</title>
                            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                            <style>
                                ${styles}
                                body {
                                    padding: 40px;
                                    font-family: 'Inter', sans-serif;
                                }

                        </head>
                        <body>

                        </html>
                    `;
                    
                    const blob = new Blob([fullHTML], { type: 'application/msword' });
                    const fileName = `${this.data.personal.name.replace(/\s+/g, '_')}_CV.doc`;
                    
                    saveAs(blob, fileName);
                    
                    this.loading.hide();

                    console.error(error);

                    alert('DOCX export failed');

                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const fileName = `${this.data.personal.name.replace(/\s+/g, '_')}_Data.json`;
                    
                    saveAs(blob, fileName);
                    
                    this.loading.hide();
                    alert('JSON data exported successfully!');

                    console.error(error);
                    this.loading.hide();
                    alert('JSON export failed');
                }

            // 6. CSV EXPORT (Statistics as spreadsheet)
            exportCSV() {
                this.loading.show('Generating CSV...', 'Creating spreadsheet');
                
                try {
                    // Create CSV content
                    let csv = 'Category,Item,Value,Details\n';
                    
                    // Add stats
                    this.data.stats.forEach(stat => {
                        csv += `Statistics,${stat.label},${stat.value},${stat.trend}\n`;
                    });
                    
                    // Add skills
                    this.data.skills.forEach(skill => {
                        csv += `Skills,${skill.name},${skill.level}%,Proficiency\n`;
                    });
                    
                    // Add timeline
                    this.data.timeline.forEach(item => {
                        csv += `Timeline,${item.year} - ${item.label},${item.value}%,Growth\n`;
                    });
                    
                    // Add projects
                    this.data.projects.forEach(proj => {
                        csv += `Projects,${proj.name},ROI:${proj.roi},Team:${proj.team}\n`;
                    });
                    
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const fileName = `${this.data.personal.name.replace(/\s+/g, '_')}_Data.csv`;
                    
                    saveAs(blob, fileName);
                    
                    this.loading.hide();
                    alert('CSV file downloaded successfully!');
                } catch (error) {
                    console.error(error);
                    this.loading.hide();
                    alert('CSV export failed');
                }
            },

            // 7. PRINT
            printCV() {
                window.print();
            },

            // Fallback print method
            fallbackPrint() {
                const printWindow = window.open('', '_blank');
                const element = document.getElementById('cvPreview');
                const styles = document.querySelector('style').innerHTML;
                
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>${this.data.personal.name} - CV</title>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                        <style>
                            ${styles}
                            body {
                                padding: 40px;
                                font-family: 'Inter', sans-serif;
                            }
                            @media print {
                                @page {
                                    size: A4;
                                    margin: 1cm;
                                }
                            }
                        </style>
                    </head>
                    <body>
                        ${element.outerHTML}
                        <script>
                            window.onload = () => {
                                setTimeout(() => {
                                    window.print();
                                    setTimeout(() => window.close(), 1000);
                                }, 500);
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                
                printWindow.document.close();
                this.loading.hide();
            }
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => cv.init());

        // Load saved data
        cv.loadFromStorage();
    </script>
