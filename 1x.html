<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0e2a38;
            --primary-light: #1e3f50;
            --primary-dark: #071a23;
            --accent: #ffb05c;
            --success: #059669;
            --danger: #dc2626;
            --info: #3b82f6;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        /* Toast System */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--info); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }

        .loading-overlay.active { display: flex; }

        .loading-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Main App */
        .app-container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Template Selector */
        .template-selector {
            display: flex;
            gap: 10px;
            padding: 15px 30px;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            overflow-x: auto;
        }

        .template-btn {
            padding: 10px 25px;
            border: 2px solid var(--gray-200);
            border-radius: 50px;
            background: white;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .template-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        /* Editor Panel */
        .editor-panel {
            background: var(--gray-50);
            border-right: 2px solid var(--gray-200);
            overflow-y: auto;
            padding: 20px;
        }

        .editor-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
        }

        .editor-section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Dynamic Items */
        .dynamic-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dynamic-item {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--gray-200);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .item-btn {
            background: none;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            padding: 5px;
        }

        .item-btn:hover {
            color: var(--danger);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: var(--gray-100);
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            color: var(--gray-600);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: var(--gray-200);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Preview Panel */
        .preview-panel {
            padding: 30px;
            overflow-y: auto;
            background: var(--gray-100);
        }

        .marketing-card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            box-shadow: var(--shadow-xl);
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        /* Feature Grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature-box {
            text-align: center;
            padding: 20px;
            background: var(--gray-50);
            border-radius: 20px;
        }

        .feature-box i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* Testimonials */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .testimonial-card {
            background: var(--gray-50);
            padding: 20px;
            border-radius: 20px;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Price Tag */
        .price-tag {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }

        .price-tag small {
            font-size: 1rem;
            color: var(--gray-600);
        }

        /* CTA Button */
        .cta-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 0;
        }

        /* Rating Stars */
        .stars {
            color: #fbbf24;
            font-size: 1.2rem;
        }

        /* Menu Items */
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--gray-200);
        }

        /* Property Features */
        .property-features {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .property-feature {
            text-align: center;
        }

        .property-feature i {
            font-size: 2rem;
            color: var(--primary);
        }

        /* Countdown */
        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .countdown-box {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 15px;
            min-width: 80px;
            text-align: center;
        }

        .countdown-number {
            font-size: 2rem;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .editor-panel {
                max-height: 500px;
            }
        }
    </style>
</head>
<body>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Editor Panel -->
            <div class="editor-panel" id="editorPanel">
                <!-- Editor content will be loaded here -->

            <!-- Preview Panel -->
            <div class="preview-panel">

        </div>
    </div>

                // RESTAURANT TEMPLATE
                restaurant: {

                // REAL ESTATE TEMPLATE
                realestate: {

                event: {

                // COURSE TEMPLATE
                course: {

                },

                // PORTFOLIO TEMPLATE
                portfolio: {
                    name: 'John Doe',
                    title: 'UI/UX Designer',
                    experience: '8+ years',
                    projects: '50+',
                    clients: '30+',
                    skills: ['UI Design', 'UX Research', ' prototyping'],
                    cta: 'Hire Me'
                },

                // RESUME TEMPLATE
                resume: {
                    name: 'Sarah Khan',
                    title: 'Senior Developer',
                    experience: '10+ years',
                    companies: ['Google', 'Amazon'],
                    skills: ['JavaScript', 'Python', 'SQL'],
                    education: 'MS Computer Science',
                    cta: 'Contact Me'
                }
            },

            // ===== TOAST SYSTEM =====
            toast: {
                show(message, type = 'info') {
                    const container = document.getElementById('toastContainer');
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    toast.innerHTML = message;
                    container.appendChild(toast);
                    setTimeout(() => toast.remove(), 3000);
                },
                success(m) { this.show(m, 'success'); },
                error(m) { this.show(m, 'error'); },
                info(m) { this.show(m, 'info'); }
            },

            // ===== LOADING SYSTEM =====
            loading: {
                show(msg = 'Processing...') {
                    document.getElementById('loadingMessage').textContent = msg;
                    document.getElementById('loadingOverlay').classList.add('active');
                },
                hide() {
                    document.getElementById('loadingOverlay').classList.remove('active');
                }
            },

            // ===== INITIALIZE =====
            init() {
                // Set first template active
                document.querySelectorAll('.template-btn')[0].classList.add('active');
                
                // Render initial template
                this.renderEditor();
                this.renderPreview();
                
                this.toast.success('All templates ready!');
            },

            // ===== SET TEMPLATE =====
            setTemplate(template) {
                try {
                    this.currentTemplate = template;
                    
                    // Update active button
                    document.querySelectorAll('.template-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.textContent.toLowerCase().includes(template)) {
                            btn.classList.add('active');
                        }
                    });
                    
                    // Render everything
                    this.renderEditor();
                    this.renderPreview();
                    
                    this.toast.success(`${template} template loaded`);
                } catch (error) {
                    console.error(error);
                    this.toast.error('Error loading template');
                }
            },

            // ===== UPDATE DATA =====
            updateData(field, value) {
                try {
                    this.templates[this.currentTemplate][field] = value;
                    this.renderPreview();
                } catch (error) {
                    console.error(error);
                }
            },

            updateFeature(index, field, value) {
                try {
                    this.templates[this.currentTemplate].features[index][field] = value;
                    this.renderPreview();
                } catch (error) {
                    console.error(error);
                }
            },

            updateStat(index, field, value) {
                try {
                    this.templates[this.currentTemplate].stats[index][field] = value;
                    this.renderPreview();
                } catch (error) {
                    console.error(error);
                }
            },

            updateReview(index, field, value) {
                try {
                    this.templates[this.currentTemplate].reviews[index][field] = value;
                    this.renderPreview();
                } catch (error) {
                    console.error(error);
                }
            },

            // ===== ADD/REMOVE ITEMS =====
            addFeature() {
                try {
                    if (!this.templates[this.currentTemplate].features) {
                        this.templates[this.currentTemplate].features = [];
                    }
                    this.templates[this.currentTemplate].features.push({ icon: 'star', text: 'New Feature' });
                    this.renderEditor();
                    this.renderPreview();
                } catch (error) {
                    this.toast.error('Features not available for this template');
                }
            },

            removeFeature(index) {
                try {
                    this.templates[this.currentTemplate].features.splice(index, 1);
                    this.renderEditor();
                    this.renderPreview();
                } catch (error) {
                    console.error(error);
                }
            },

            addStat() {
                try {
                    if (!this.templates[this.currentTemplate].stats) {
                        this.templates[this.currentTemplate].stats = [];
                    }
                    this.templates[this.currentTemplate].stats.push({ value: '100+', label: 'New' });
                    this.renderEditor();
                    this.renderPreview();
                } catch (error) {
                    this.toast.error('Stats not available');
                }
            },

            removeStat(index) {
                try {
                    this.templates[this.currentTemplate].stats.splice(index, 1);
                    this.renderEditor();
                    this.renderPreview();
                } catch (error) {

                }

                try {

                    }
                    this.templates[this.currentTemplate].reviews.push({ name: 'New User', rating: 5, text: 'Great!' });

                    this.renderPreview();

                try {
                    this.templates[this.currentTemplate].reviews.splice(index, 1);
                    this.renderEditor();
                    this.renderPreview();
                } catch (error) {

            // ===== RENDER EDITOR =====
            renderEditor() {
                const template = this.currentTemplate;
                const data = this.templates[template];
                const editor = document.getElementById('editorPanel');
                
                let html = '';

                // Basic Info Section (Common for all)
                html += `
                    <div class="editor-section">
                        <h2><i class="fas fa-info-circle"></i> Basic Info</h2>
                        <div class="form-group">
                            <label>Name/Title</label>
                            <input type="text" class="form-control" value="${data.name || ''}" 
                                oninput="app.updateData('name', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Tagline</label>
                            <input type="text" class="form-control" value="${data.tagline || ''}" 
                                oninput="app.updateData('tagline', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control" oninput="app.updateData('description', this.value)">${data.description || ''}</textarea>
                        </div>
                    </div>
                `;

                // Features Section
                if (data.features) {
                    html += `
                        <div class="editor-section">
                            <h2><i class="fas fa-list"></i> Features</h2>
                            <div id="featuresEditor"></div>
                            <button class="add-btn" onclick="app.addFeature()">
                                <i class="fas fa-plus"></i> Add Feature
                            </button>
                        </div>
                    `;
                }

                // Stats Section
                if (data.stats || data.statistics) {
                    html += `
                        <div class="editor-section">
                            <h2><i class="fas fa-chart-line"></i> Statistics</h2>
                            <div id="statsEditor"></div>
                            <button class="add-btn" onclick="app.addStat()">
                                <i class="fas fa-plus"></i> Add Stat
                            </button>
                        </div>
                    `;
                }

                // Reviews Section
                if (data.reviews || data.testimonials) {
                    html += `
                        <div class="editor-section">
                            <h2><i class="fas fa-star"></i> Reviews</h2>
                            <div id="reviewsEditor"></div>
                            <button class="add-btn" onclick="app.addReview()">
                                <i class="fas fa-plus"></i> Add Review
                            </button>
                        </div>
                    `;
                }

                // Price Section
                if (data.price) {
                    html += `
                        <div class="editor-section">
                            <h2><i class="fas fa-tag"></i> Pricing</h2>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Price</label>
                                    <input type="text" class="form-control" value="${data.price}" 
                                        oninput="app.updateData('price', this.value)">
                                </div>
                                <div class="form-group">
                                    <label>Currency</label>
                                    <input type="text" class="form-control" value="${data.currency || '$'}" 
                                        oninput="app.updateData('currency', this.value)">
                                </div>
                            </div>
                        </div>
                    `;
                }

                // CTA Section
                if (data.cta) {
                    html += `
                        <div class="editor-section">
                            <h2><i class="fas fa-bullseye"></i> Call to Action</h2>
                            <div class="form-group">
                                <label>Button Text</label>
                                <input type="text" class="form-control" value="${data.cta}" 
                                    oninput="app.updateData('cta', this.value)">
                            </div>
                        </div>
                    `;
                }

                editor.innerHTML = html;

                // Render sub-editors
                if (data.features) this.renderFeatures();
                if (data.stats) this.renderStats();
                if (data.reviews) this.renderReviews();
            },

            renderFeatures() {
                const container = document.getElementById('featuresEditor');
                if (!container) return;
                
                const features = this.templates[this.currentTemplate].features || [];
                let html = '<div class="dynamic-items">';
                
                features.forEach((f, i) => {
                    html += `
                        <div class="dynamic-item">
                            <div class="item-header">
                                <span>Feature ${i + 1}</span>
                                <button class="item-btn" onclick="app.removeFeature(${i})">✕</button>
                            </div>
                            <div class="form-row">
                                <input type="text" class="form-control" placeholder="Icon" value="${f.icon}" 
                                    oninput="app.updateFeature(${i}, 'icon', this.value)">
                                <input type="text" class="form-control" placeholder="Text" value="${f.text}" 
                                    oninput="app.updateFeature(${i}, 'text', this.value)">
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            },

            renderStats() {
                const container = document.getElementById('statsEditor');
                if (!container) return;
                
                const stats = this.templates[this.currentTemplate].stats || [];
                let html = '<div class="dynamic-items">';
                
                stats.forEach((s, i) => {

                switch(template) {
                    case 'product':
                        html = this.renderProductPreview(data);
                        break;
                    case 'service':
                        html = this.renderServicePreview(data);
                        break;
                    case 'company':
                        html = this.renderCompanyPreview(data);
                        break;
                    case 'app':
                        html = this.renderAppPreview(data);
                        break;
                    case 'restaurant':
                        html = this.renderRestaurantPreview(data);
                        break;
                    case 'realestate':
                        html = this.renderRealEstatePreview(data);
                        break;
                    case 'event':
                        html = this.renderEventPreview(data);
                        break;
                    case 'course':
                        html = this.renderCoursePreview(data);
                        break;
                    case 'portfolio':
                        html = this.renderPortfolioPreview(data);
                        break;
                    case 'resume':
                        html = this.renderResumePreview(data);

                preview.innerHTML = html;

                this.loading.show('Generating PDF...');
                
                try {
                    const element = document.getElementById('previewCard');
                    
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        backgroundColor: '#ffffff'
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'px',
                        format: 'a4'
                    });
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    const ratio = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height);
                    const width = canvas.width * ratio;
                    const height = canvas.height * ratio;
                    
                    const x = (pdfWidth - width) / 2;
                    const y = (pdfHeight - height) / 2;
                    
                    pdf.addImage(imgData, 'PNG', x, y, width, height);
                    
                    const fileName = `${this.templates[this.currentTemplate].name.replace(/\s+/g, '_')}.pdf`;
                    pdf.save(fileName);
                    
                    this.loading.hide();
                    this.toast.success('PDF downloaded!');
                } catch (error) {
                    console.error(error);
                    this.loading.hide();
                    this.toast.error('PDF failed');
                }
            },

            async exportPNG() {
                this.loading.show('Generating PNG...');
                
                try {
                    const element = document.getElementById('previewCard');
                    
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        backgroundColor: '#ffffff'
                    });
                    
                    const fileName = `${this.templates[this.currentTemplate].name.replace(/\s+/g, '_')}.png`;
                    
                    canvas.toBlob((blob) => {
                        saveAs(blob, fileName);
                    });
                    
                    this.loading.hide();
                    this.toast.success('PNG downloaded!');
                } catch (error) {
                    this.loading.hide();
                    this.toast.error('PNG failed');
                }
            },

            exportHTML() {
                this.loading.show('Generating HTML...');
                
                try {
                    const element = document.getElementById('previewCard');
                    const styles = document.querySelector('style').innerHTML;
                    
                    const fullHTML = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>${this.templates[this.currentTemplate].name}</title>
                            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
                            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                            <style>${styles}</style>
                        </head>
                        <body>
                            ${element.outerHTML}
                        </body>
                        </html>
                    `;
                    
                    const blob = new Blob([fullHTML], { type: 'text/html' });
                    const fileName = `${this.templates[this.currentTemplate].name.replace(/\s+/g, '_')}.html`;
                    
                    saveAs(blob, fileName);
                    
                    this.loading.hide();
                    this.toast.success('HTML downloaded!');
                } catch (error) {
                    this.loading.hide();
                    this.toast.error('HTML failed');
                }
            }
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
